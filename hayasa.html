<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>速さの試し</title>
<style>
  /* ★アプリの AI 工場（2026-10-31）：Qwen3.5-0.8B をこの端末の中だけで動かして、1秒に何字出るかを測る */
  :root { --bg:#fbf8f3; --fg:#2a2420; --sub:#7a6e64; --acc:#c2562b; --card:#fff; --line:#e6ddd2; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1d1a17; --fg:#f2ece4; --sub:#a89c90; --acc:#e57a4c; --card:#28241f; --line:#3a342d; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 -apple-system, "Hiragino Sans", sans-serif; }
  main { max-width:560px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:22px; margin:0 0 4px; }
  p.sub { color:var(--sub); margin:0 0 20px; font-size:14px; }
  button { width:100%; min-height:56px; font-size:18px; font-weight:700; border:0; border-radius:14px; background:var(--acc); color:#fff; }
  button:disabled { opacity:.5; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-top:14px; }
  .big { font-size:40px; font-weight:800; line-height:1.1; }
  .row { display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px solid var(--line); font-size:15px; }
  .row:last-child { border:0; }
  #log { white-space:pre-wrap; font-size:14px; color:var(--sub); }
  #out { white-space:pre-wrap; font-size:15px; }
  #copy { margin-top:14px; background:var(--fg); color:var(--bg); }
</style>
</head>
<body>
<main>
  <h1>小さな AI の速さの試し</h1>
  <p class="sub">0.8B の AI をこのスマホの中だけで動かします。毎回約0.5GB を読み込みます（Wi-Fi 推奨）。</p>
  <button id="go">始める</button>
  <div class="card"><div class="sub">1秒に出た字数</div><div class="big" id="cps">—</div></div>
  <div class="card" id="rows"></div>
  <div class="card"><div class="sub">AI の返事</div><div id="out"></div></div>
  <div class="card"><div id="log">読み込み中…</div></div>
  <button id="copy" disabled>結果をコピー</button>
</main>
<script type="module">
// ★transformers.js は 4.3.1（2026-10-06）＝Qwen3.5 の文章だけの型（Qwen3_5ForCausalLM）が入っている版
// ★web.min.js は onnxruntime を外から呼ぶ（★ブラウザでは読めず、ボタンが動かなかった・10-31）→ 全部入りの min.js
const $ = (id) => document.getElementById(id);
const fail = (e) => { $("log").textContent += "\n★止まった：" + (e?.message || e); $("go").disabled = false; $("go").textContent = "もう一度"; };
window.addEventListener("error", (e) => fail(e.error || e.message));
window.addEventListener("unhandledrejection", (e) => fail(e.reason));
const res = { ua: navigator.userAgent, webgpu: !!navigator.gpu };
let AutoTokenizer, AutoModelForCausalLM, env;
try {
  ({ AutoTokenizer, AutoModelForCausalLM, env } = await import("https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.1/dist/transformers.min.js"));
  // ★iOS は1つのタブ 2,048MB で落とす。落とし終わりに重さを2つ持つ（読んだ物＋キャッシュに渡す写し）のが原因（transformers.js #1827・10-29）
  //   → キャッシュに入れない（毎回落とし直す代わりに写しが1つ減る）＋ JSPI 版の部品（Safari で数百MB軽い・#1835）
  env.useBrowserCache = false;
  const ortv = env.backends?.onnx?.versions?.web;
  if (ortv && "Suspending" in WebAssembly) {
    const dist = `https://cdn.jsdelivr.net/npm/onnxruntime-web@${ortv}/dist/`;
    env.backends.onnx.wasm.wasmPaths = { mjs: dist + "ort-wasm-simd-threaded.jspi.mjs", wasm: dist + "ort-wasm-simd-threaded.jspi.wasm" };
  }
  res.jspi = !!(ortv && "Suspending" in WebAssembly);
  $("log").textContent = "準備できました。「始める」を押してください";
} catch (e) { fail(e); }
// ★iPhone の Safari は写真の部分つき（約0.65GB）でタブが落ちて読み直された（10-31）→ 文章だけの版（q4f16 で約0.47GB）
const MODEL = "onnx-community/Qwen3.5-0.8B-Text-ONNX";
// ★落ちて読み直されても、どこまで進んだかを残す（★次に開いた時に出す）
const STAGE = "hayasa_stage";
const mark = (s) => { try { localStorage.setItem(STAGE, s + "（" + new Date().toLocaleTimeString() + "）"); } catch (e) {} };
try { const was = localStorage.getItem(STAGE); if (was && !was.startsWith("終わった")) $("log").textContent += "\n★前回は「" + was + "」の所で落ちました"; } catch (e) {}
// ★REALT の使い方の説明に近い問い（★答えの中身は測らない・速さだけ）
const ASKS = [
  "SNSアプリで、友達を追加するにはどうすればいいですか？短く教えて。",
  "投稿に写真を2枚つけたいです。どうすればいい？",
  "通知がうるさいので減らしたい。どこを触ればいい？",
];
const log = (s) => { $("log").textContent += "\n" + s; };
const row = (k, v) => { $("rows").insertAdjacentHTML("beforeend", `<div class="row"><span>${k}</span><b>${v}</b></div>`); };

async function load(dtype, device) {
  const tokenizer = await AutoTokenizer.from_pretrained(MODEL);
  let last = -1;
  const model = await AutoModelForCausalLM.from_pretrained(MODEL, { dtype, device,
    progress_callback: (p) => { if (p.status === "done" && p.file?.includes("onnx_data")) mark("落とし終わり・組み立て中");
      if (p.status === "progress" && p.file?.includes("onnx_data")) {
      const pc = Math.floor(p.progress); if (pc !== last && pc % 10 === 0) { last = pc; mark("落とす " + pc + "%"); $("cps").textContent = "落とす " + pc + "%"; } } } });
  return { tokenizer, model };
}

$("go").onclick = async () => { try { await run(); } catch (e) { fail(e); } };
async function run() {
  $("go").disabled = true; $("rows").innerHTML = ""; $("out").textContent = ""; $("log").textContent = "WebGPU：" + (res.webgpu ? "あり" : "なし（遅い道で動かします）");
  let f16 = false;
  try { const a = await navigator.gpu?.requestAdapter(); f16 = !!a?.features.has("shader-f16"); } catch (e) {}
  res.f16 = f16;
  const device = res.webgpu ? "webgpu" : "wasm";
  log("AI を読み込み中（初回は数分）…");
  let t0 = performance.now(), m;
  try {
    m = await load(f16 ? "q4f16" : "q4", device); res.dtype = f16 ? "q4f16" : "q4";
  } catch (e) {
    log("1回目の読み込みに失敗：" + e.message + "\n→ q4 / wasm でやり直します");
    t0 = performance.now(); m = await load("q4", "wasm"); res.dtype = "q4"; res.fallback = String(e.message).slice(0, 200);
  }
  res.device = m.model.sessions ? device : device;
  mark("読み込み終わり・答える前");
  res.load_sec = +((performance.now() - t0) / 1000).toFixed(1);
  log(`読み込み ${res.load_sec}秒（${res.dtype}・${device}）`);
  res.runs = [];
  for (const ask of ASKS) {
    mark("答える " + (res.runs.length + 1) + "問目");
    const inputs = m.tokenizer.apply_chat_template([{ role: "user", content: ask }],
      { add_generation_prompt: true, enable_thinking: false, return_dict: true });
    const n_in = inputs.input_ids.dims.at(-1);
    const t1 = performance.now();
    const outs = await m.model.generate({ ...inputs, max_new_tokens: 120, do_sample: false, repetition_penalty: 1.2 }); // ★無いと同じ句を繰り返した（PC で確かめた・10-31）
    const sec = (performance.now() - t1) / 1000;
    const ans = m.tokenizer.batch_decode(outs.slice(null, [n_in, null]), { skip_special_tokens: true })[0].trim();
    const ntok = outs.dims.at(-1) - n_in;
    const r = { sec: +sec.toFixed(1), tok: ntok, chars: [...ans].length, cps: +([...ans].length / sec).toFixed(1), tps: +(ntok / sec).toFixed(1) };
    res.runs.push(r);
    $("out").textContent += "Q " + ask + "\nA " + ans + "\n\n";
    log(`${r.chars}字 ${r.sec}秒 → ${r.cps}字/秒`);
  }
  // ★1回目は準備の時間が混ざるので、2回目と3回目で数える
  const later = res.runs.slice(1);
  res.cps = +(later.reduce((a, r) => a + r.chars, 0) / later.reduce((a, r) => a + r.sec, 0)).toFixed(1);
  res.tps = +(later.reduce((a, r) => a + r.tok, 0) / later.reduce((a, r) => a + r.sec, 0)).toFixed(1);
  $("cps").textContent = res.cps + " 字";
  row("読み込み", res.load_sec + " 秒"); row("1秒の語（トークン）", res.tps); row("動かし方", `${res.dtype}・${device}`);
  $("copy").disabled = false;
  mark("終わった");
}
$("copy").onclick = async () => {
  const s = JSON.stringify(res);
  try { await navigator.clipboard.writeText(s); $("copy").textContent = "コピーしました"; }
  catch (e) { $("log").textContent = s; $("copy").textContent = "下の文字を長押しでコピー"; }
};
</script>
</body>
</html>
