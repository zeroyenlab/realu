<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>速さの試し</title>
<style>
  /* ★アプリの AI 工場（2026-10-31）：Qwen3.5-0.8B をこの端末の中だけで動かして、1秒に何字出るかを測る */
  :root { --bg:#fbf8f3; --fg:#2a2420; --sub:#7a6e64; --acc:#c2562b; --card:#fff; --line:#e6ddd2; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1d1a17; --fg:#f2ece4; --sub:#a89c90; --acc:#e57a4c; --card:#28241f; --line:#3a342d; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 -apple-system, "Hiragino Sans", sans-serif; }
  main { max-width:560px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:22px; margin:0 0 4px; }
  p.sub { color:var(--sub); margin:0 0 20px; font-size:14px; }
  button { width:100%; min-height:56px; font-size:18px; font-weight:700; border:0; border-radius:14px; background:var(--acc); color:#fff; }
  button:disabled { opacity:.5; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-top:14px; }
  .big { font-size:40px; font-weight:800; line-height:1.1; }
  .row { display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px solid var(--line); font-size:15px; }
  .row:last-child { border:0; }
  #log { white-space:pre-wrap; font-size:14px; color:var(--sub); }
  #out { white-space:pre-wrap; font-size:15px; }
  #copy { margin-top:14px; background:var(--fg); color:var(--bg); }
</style>
</head>
<body>
<main>
  <h1>小さな AI の速さの試し</h1>
  <p class="sub">0.8B の AI をこのスマホの中だけで動かします。最初に約0.5GB を落としてスマホに保存します（Wi-Fi 推奨・2回目からは速い）。</p>
  <button id="go">始める</button>
  <div class="card"><div class="sub">1秒に出た字数</div><div class="big" id="cps">—</div></div>
  <div class="card" id="rows"></div>
  <div class="card"><div class="sub">AI の返事</div><div id="out"></div></div>
  <div class="card"><div id="log">読み込み中…</div></div>
  <button id="copy" disabled>結果をコピー</button>
</main>
<script type="text/plain" id="wk">
// ★裏の働き手（Worker）：重みを落として OPFS に少しずつ書き、要る分だけ読んで渡す
// ★iOS は1つのタブ 2,048MB で落とす。キャッシュ経由だと重み全部がメモリに載り、組み立て中に落ちた（10-31）
//   → transformers.js #1827 の回り道（OPFS に書く・subarray で1つずつ読む・読む箱は使い回す）
const post = (type, v) => postMessage({ type, v });
const mark = (s) => post("mark", s);
const log = (s) => post("log", s);
const MODEL = "onnx-community/Qwen3.5-0.8B-Text-ONNX";
const ASKS = [
  "SNSアプリで、友達を追加するにはどうすればいいですか？短く教えて。",
  "投稿に写真を2枚つけたいです。どうすればいい？",
  "通知がうるさいので減らしたい。どこを触ればいい？",
];
const res = { ua: navigator.userAgent, webgpu: !!navigator.gpu, worker: true };

// ★重みを OPFS へ。途中で落ちても、大きさが合わなければ落とし直す
async function weights(file) {
  const url = `https://huggingface.co/${MODEL}/resolve/main/onnx/${file}`;
  const dir = await navigator.storage.getDirectory();
  const fh = await dir.getFileHandle(file, { create: true });
  const handle = await fh.createSyncAccessHandle();
  const head = await fetch(url, { method: "HEAD" });
  const want = +head.headers.get("content-length") || 0;
  if (!want || handle.getSize() !== want) {
    handle.truncate(0);
    const r = await fetch(url);
    const reader = r.body.getReader();
    let pos = 0, last = -1;
    for (let c; !(c = await reader.read()).done; ) {
      handle.write(c.value, { at: pos }); pos += c.value.byteLength;
      const pc = want ? Math.floor(pos / want * 100) : 0;
      if (pc !== last && pc % 10 === 0) { last = pc; mark("落とす " + pc + "%"); post("cps", "落とす " + pc + "%"); }
    }
    handle.flush();
    res.downloaded = true;
  } else res.downloaded = false;
  const size = handle.getSize();
  let scratch = new ArrayBuffer(0);
  const data = new Uint8Array(0);
  Object.defineProperties(data, {
    byteLength: { get: () => size },
    length: { get: () => size },
    subarray: { value(begin = 0, end = size) {
      const n = end - begin;
      if (scratch.byteLength < n) scratch = new ArrayBuffer(n);
      const slice = new Uint8Array(scratch, 0, n);
      handle.read(slice, { at: begin });
      return slice;
    } },
  });
  return { data, size, close: () => { handle.close(); scratch = null; } };
}

onmessage = async () => {
  try {
    const { AutoTokenizer, AutoModelForCausalLM, env } = await import("https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.1/dist/transformers.min.js");
    // ★JSPI 版の部品（Safari で数百MB軽い・#1835）
    const ortv = env.backends?.onnx?.versions?.web;
    if (ortv && "Suspending" in WebAssembly) {
      const dist = `https://cdn.jsdelivr.net/npm/onnxruntime-web@${ortv}/dist/`;
      env.backends.onnx.wasm.wasmPaths = { mjs: dist + "ort-wasm-simd-threaded.jspi.mjs", wasm: dist + "ort-wasm-simd-threaded.jspi.wasm" };
    }
    res.jspi = !!(ortv && "Suspending" in WebAssembly);
    let f16 = false;
    try { const a = await navigator.gpu?.requestAdapter(); f16 = !!a?.features.has("shader-f16"); } catch (e) {}
    res.f16 = f16;
    const dtype = f16 ? "q4f16" : "q4", device = res.webgpu ? "webgpu" : "wasm", file = `model_${dtype}.onnx_data`;
    res.dtype = dtype; res.device = device;
    log("WebGPU：" + (res.webgpu ? "あり" : "なし（遅い道）") + "・" + dtype + (res.jspi ? "・JSPI" : ""));
    log("AI を落としています（初回は数分・2回目からは保存した物を使う）…");
    const t0 = performance.now();
    const w = await weights(file);
    res.dl_sec = +((performance.now() - t0) / 1000).toFixed(1);
    mark("落とし終わり・組み立て中");
    log(`落とす ${res.dl_sec}秒（${(w.size / 2 ** 20).toFixed(0)}MB）→ 組み立て中…`);
    const t1 = performance.now();
    const tokenizer = await AutoTokenizer.from_pretrained(MODEL);
    const model = await AutoModelForCausalLM.from_pretrained(MODEL, { dtype, device,
      use_external_data_format: 0, session_options: { externalData: [{ path: file, data: w.data }] } });
    w.close();
    res.load_sec = +((performance.now() - t1) / 1000).toFixed(1);
    mark("組み立て終わり・答える前");
    log(`組み立て ${res.load_sec}秒`);
    res.runs = [];
    for (const ask of ASKS) {
      mark("答える " + (res.runs.length + 1) + "問目");
      const inputs = tokenizer.apply_chat_template([{ role: "user", content: ask }],
        { add_generation_prompt: true, enable_thinking: false, return_dict: true });
      const n_in = inputs.input_ids.dims.at(-1);
      const t2 = performance.now();
      const outs = await model.generate({ ...inputs, max_new_tokens: 120, do_sample: false, repetition_penalty: 1.2 }); // ★無いと同じ句を繰り返した（10-31）
      const sec = (performance.now() - t2) / 1000;
      const ans = tokenizer.batch_decode(outs.slice(null, [n_in, null]), { skip_special_tokens: true })[0].trim();
      const ntok = outs.dims.at(-1) - n_in;
      const r = { sec: +sec.toFixed(1), tok: ntok, chars: [...ans].length, cps: +([...ans].length / sec).toFixed(1), tps: +(ntok / sec).toFixed(1) };
      res.runs.push(r);
      post("out", "Q " + ask + "\nA " + ans + "\n\n");
      log(`${r.chars}字 ${r.sec}秒 → ${r.cps}字/秒`);
    }
    // ★1回目は準備の時間が混ざるので、2回目と3回目で数える
    const later = res.runs.slice(1);
    res.cps = +(later.reduce((a, r) => a + r.chars, 0) / later.reduce((a, r) => a + r.sec, 0)).toFixed(1);
    res.tps = +(later.reduce((a, r) => a + r.tok, 0) / later.reduce((a, r) => a + r.sec, 0)).toFixed(1);
    post("done", res);
  } catch (e) { post("fail", String(e?.message || e)); }
};
</script>
<script type="module">
// ★transformers.js は 4.3.1（2026-10-06）＝Qwen3.5 の文章だけの型（Qwen3_5ForCausalLM）が入っている版・全部入りの min.js
// ★画面は表示だけ。重い仕事は裏の働き手（上の wk）がする
const $ = (id) => document.getElementById(id);
const fail = (e) => { $("log").textContent += "\n★止まった：" + (e?.message || e); $("go").disabled = false; $("go").textContent = "もう一度"; };
window.addEventListener("error", (e) => fail(e.error || e.message));
window.addEventListener("unhandledrejection", (e) => fail(e.reason));
// ★落ちて読み直されても、どこまで進んだかを残す（★次に開いた時に出す）
const STAGE = "hayasa_stage";
const mark = (s) => { try { localStorage.setItem(STAGE, s + "（" + new Date().toLocaleTimeString() + "）"); } catch (e) {} };
$("log").textContent = "準備できました。「始める」を押してください";
try { const was = localStorage.getItem(STAGE); if (was && !was.startsWith("終わった")) $("log").textContent += "\n★前回は「" + was + "」の所で落ちました"; } catch (e) {}
let res = null;
const row = (k, v) => { $("rows").insertAdjacentHTML("beforeend", `<div class="row"><span>${k}</span><b>${v}</b></div>`); };

$("go").onclick = () => {
  $("go").disabled = true; $("rows").innerHTML = ""; $("out").textContent = ""; $("log").textContent = "始めます"; $("cps").textContent = "—";
  const url = URL.createObjectURL(new Blob([$("wk").textContent], { type: "text/javascript" }));
  const w = new Worker(url, { type: "module" });
  w.onerror = (e) => fail(e.message || "働き手が止まった");
  w.onmessage = ({ data: { type, v } }) => {
    if (type === "mark") mark(v);
    else if (type === "log") $("log").textContent += "\n" + v;
    else if (type === "cps") $("cps").textContent = v;
    else if (type === "out") $("out").textContent += v;
    else if (type === "fail") { mark("終わった（止まった）"); fail(v); w.terminate(); }
    else if (type === "done") {
      res = v; $("cps").textContent = res.cps + " 字";
      row("落とす", res.dl_sec + " 秒"); row("組み立て", res.load_sec + " 秒"); row("1秒の語（トークン）", res.tps); row("動かし方", `${res.dtype}・${res.device}`);
      $("copy").disabled = false; $("go").disabled = false; $("go").textContent = "もう一度";
      mark("終わった"); w.terminate();
    }
  };
  w.postMessage("go");
};
$("copy").onclick = async () => {
  const s = JSON.stringify(res);
  try { await navigator.clipboard.writeText(s); $("copy").textContent = "コピーしました"; }
  catch (e) { $("log").textContent = s; $("copy").textContent = "下の文字を長押しでコピー"; }
};
</script>
</body>
</html>
