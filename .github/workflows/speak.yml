name: realu speaks

# ★★★書いてみる日。★育つのは1日1回だが、書くのはもっと頻繁でいい。
#   ★同じ書き出しで書かせて並べれば、★育ちが目で見える。

on:
  schedule:
    - cron: "40 * * * *"        # ★1時間ごと（★書くのは頻繁でいい）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: realu-speak
  cancel-in-progress: false

jobs:
  speak:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 道具を入れる
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          # ★★grow.yml には足したのに、ここを直し忘れていた（★run#3 が落ちた）
          pip install --quiet tokenizers numpy

      - name: 頭を取ってくる
        uses: actions/cache/restore@v4
        with:
          path: work
          key: realu-speak-none
          restore-keys: |
            realu-work-

      - name: Release からも探す
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FOODKEY: ${{ secrets.REALU_FOOD_KEY }}
        run: |
          mkdir -p work
          # ★★★2026-09-12 の訂正: ★**系統ごとの脳**を読む。
          #   ★それまでは realu.enc（★系統に分かれる前の脳）を落としていた。
          #   ★★2026-09-11 に L1/L2/L3 へ分かれてから、★realu.enc は**更新されていない**。
          #   ★実測: said.json が6回連続で同じ 層10 / val 3.0552。
          #     ★grow 側は L1 が 層11 / val 2.7841 まで来ていた。
          #   ★★★つまり、★分かれて以降に書いた文章は**全部2日前の脳のもの**だった。
          #   ★どの系統で書くかは REALU_SPEAK_LIN で決める（★既定は L1）。
          SPEAK_LIN="${REALU_SPEAK_LIN:-L1}"
          if [ ! -f work/realu.pt ] && [ -n "$FOODKEY" ]; then
            # ★★系統の脳 → 無ければ一つ前 → それも無ければ分かれる前、の順で探す
            for NAME in "realu-$SPEAK_LIN" "realu-$SPEAK_LIN-prev" realu realu-prev; do
              gh release download brain -p "$NAME.enc" -D /tmp 2>/dev/null \
                && openssl enc -d -aes-256-cbc -pbkdf2 \
                     -in "/tmp/$NAME.enc" -out work/realu.pt \
                     -pass env:FOODKEY 2>/dev/null \
                && echo "★$NAME で書く" && rm -f "/tmp/$NAME.enc" && break
              rm -f "/tmp/$NAME.enc"
            done
          fi
          [ -f work/realu.pt ] && echo "★頭がある" || echo "★まだ頭がない"

      - name: 書く
        run: python -u speak.py

      - name: 書いたものを残す
        run: |
          git config user.name  "realu"
          git config user.email "realu@users.noreply.github.com"
          [ -f said.json ] || exit 0
          cp said.json /tmp/said.mine
          for i in 1 2 3; do
            git fetch origin main && git reset --hard origin/main
            cp /tmp/said.mine said.json
            git add said.json
            if git diff --staged --quiet; then echo "変化なし"; break; fi
            git commit -q -m "レアルが書いた ($(date -u +'%m-%d %H:%M')Z)"
            if git push origin HEAD:main; then echo "★残した"; break; fi
            sleep 5
          done

      - name: 触れてはいけない所を守る
        if: always()
        run: |
          git checkout -- . || true
          git clean -fd -e work || true
