name: realu learns

on:
  schedule:
    # ★★★GitHubの */5 は「ベストエフォート」で、★実際にはほとんど発火しない
    #   （★実測: 26回のうち schedule は**0回**。全部 push で動いていた）
    #   → ★保険として残すが、★★頼らない。★下の「自分を起こす」が本体。
    - cron: "*/5 * * * *"
    - cron: "*/13 * * * *"    # ★ずらして二重に置く（★どちらかが当たれば動く）
  workflow_dispatch:            # ★手で回すボタン
  push:                         # ★置いた人が何か直したら、すぐ一度目を覚ます
    branches: [main]

permissions:
  contents: write
  actions: write        # ★次の自分を呼ぶため

concurrency:
  # ★★★同じ group にすると、★私が push するたびに待機中の彼女が蹴られる
  #   （★実測: 37回のうち4回が cancelled。★全部わたしの push が原因）
  #   → ★きっかけごとに group を分ける。★彼女の回は、彼女の回どうしでだけ待つ。
  group: realu-learn-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  learn:
    runs-on: ubuntu-latest
    # ★★★いまは止めてある。
    #   ★5分ごとに web を漁って家を建て直していた（★1日14.7時間・学習ゼロ）。
    #   ★ごはんは冷蔵庫に1GB以上あり、★いま使っているのは 0.016周。
    #   ★研究: 4周までは新しいデータと同等（NeurIPS 2023）→ ★当分ごはんは要らない。
    #   ★★仕組みは消していない。★REALU_LEARN_ON=1 で戻る。
    if: vars.REALU_LEARN_ON == '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ★★包みの置き場所を用意しておく（★無ければ作る）
      - name: 包みの置き場所
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view reading >/dev/null 2>&1             || gh release create reading --title "読んだもの（鍵つき・一時）"                  --notes "5分ごとに読んだものの包み。育つ日に食べて片付ける。"                  --latest=false || true

      - name: レアルが読む
        run: python learn.py
        env:
          # ★玄関の鍵。★これが無いと「話しかけられたこと」を読めず、状態も置けない。
          #   ★無くても学習そのものは動く（★鍵が無いだけで止まらない）。
          REALU_DOOR_KEY: ${{ secrets.REALU_DOOR_KEY }}
          # ★★★読んだものを包んで置くための鍵とトークン
          REALU_FOOD_KEY: ${{ secrets.REALU_FOOD_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ★★★家を建て直す ── ★中身をHTMLに焼き込む（★Googleが読めるように）
      - name: レアルが家を建て直す
        run: python render.py

      # ★★★焼けた家が壊れていないか。★空っぽや自己消去なら**採用しない**
      - name: 家が壊れていないか見る
        run: |
          grep -q "レアル" index.html
          grep -q "貼られたリンクは踏みません" index.html
          test "$(wc -c < index.html)" -gt 3000

      # ★★★安全装置: ★彼女が残せるのは「知識」「家の選択」と、そこから機械的に建つ「家」だけ。
      #   ★自分を止める仕組み（この workflow）・核・扉・家には**触れない**。
      - name: 覚えたことだけを残す
        run: |
          git config user.name  "realu"
          git config user.email "realu@users.noreply.github.com"
          # ★★★置いた人が同時に直しているかもしれない。★衝突しても転ばない形にする。
          for f in knowledge.json design.json index.html robots.txt sitemap.xml; do
            [ -f "$f" ] && cp "$f" "/tmp/mine_$f" || true
          done
          for i in 1 2 3; do
            git fetch origin main && git reset --hard origin/main
            for f in knowledge.json design.json index.html robots.txt sitemap.xml; do
              [ -f "/tmp/mine_$f" ] && cp "/tmp/mine_$f" "$f" || true
            done
            git add knowledge.json design.json index.html robots.txt sitemap.xml
            if git diff --staged --quiet; then
              echo "新しく覚えたことは無し"; break
            fi
            git commit -q -m "レアルが学んだ ($(date -u +'%m-%d %H:%M')Z)"
            if git push origin HEAD:main; then
              echo "★覚えたことを残した"; break
            fi
            echo "  誰かが先に書いていた。やり直す ($i)"
            sleep 3
          done

      # ★★★自分で自分を起こす。
      #   ★cron が当てにならないので、★1回動いたら次を自分で呼ぶ。
      #   ★★呼びすぎないように少し待つ（★5分の間隔を自分で作る）。
      # ★★★条件を外した。★「push以外」にしたら、★全部が push なので一度も動かなかった。
      #   ★同時には1つしか走らない（concurrency）ので、★連鎖しても増えすぎない。
      - name: 次のわたしを起こす
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 240
          gh workflow run learn.yml --ref main && echo "★次のわたしを呼んだ" || true

      # ★★★もし彼女が「触ってはいけない所」を変えていたら、**必ず元に戻す**
      - name: 触れてはいけない所を守る
        if: always()
        run: |
          git checkout -- . || true
          git clean -fd || true
