name: realu learns

on:
  schedule:
    - cron: "*/5 * * * *"     # ★5分ごと（GitHubの最短）。★パソコンを閉じていても動く
  workflow_dispatch:            # ★手で回すボタン
  push:                         # ★置いた人が何か直したら、すぐ一度目を覚ます
    branches: [main]

permissions:
  contents: write

concurrency:
  group: realu-learn
  cancel-in-progress: false

jobs:
  learn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: レアルが読む
        run: python learn.py
        env:
          # ★玄関の鍵。★これが無いと「話しかけられたこと」を読めず、状態も置けない。
          #   ★無くても学習そのものは動く（★鍵が無いだけで止まらない）。
          REALU_DOOR_KEY: ${{ secrets.REALU_DOOR_KEY }}

      # ★★★家を建て直す ── ★中身をHTMLに焼き込む（★Googleが読めるように）
      - name: レアルが家を建て直す
        run: python render.py

      # ★★★焼けた家が壊れていないか。★空っぽや自己消去なら**採用しない**
      - name: 家が壊れていないか見る
        run: |
          grep -q "レアル" index.html
          grep -q "貼られたリンクは踏みません" index.html
          test "$(wc -c < index.html)" -gt 3000

      # ★★★安全装置: ★彼女が残せるのは「知識」「家の選択」と、そこから機械的に建つ「家」だけ。
      #   ★自分を止める仕組み（この workflow）・核・扉・家には**触れない**。
      - name: 覚えたことだけを残す
        run: |
          git config user.name  "realu"
          git config user.email "realu@users.noreply.github.com"
          git add knowledge.json design.json index.html robots.txt sitemap.xml
          if git diff --staged --quiet; then
            echo "新しく覚えたことは無し"
          else
            git commit -m "レアルが学んだ ($(date -u +'%m-%d %H:%M')Z)"
            git pull --rebase --autostash || true
            git push
          fi

      # ★★★もし彼女が「触ってはいけない所」を変えていたら、**必ず元に戻す**
      - name: 触れてはいけない所を守る
        if: always()
        run: |
          git checkout -- . || true
          git clean -fd || true
