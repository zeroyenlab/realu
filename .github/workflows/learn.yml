name: realu measures

on:
  # ★★★ここは「測る係」。★5分ごとに、勘で決めた設定を数字で確かめる。
  #   ★前は web を漁っていた（1日14.7時間・学習ゼロ）。
  #   ★ごはんは足りている（0.016周）ので、★測る方に回した。
  schedule:
    # ★★★2026-09-09: 5分ごと → 20分ごと。
    #   ★1回が約7分かかるのに5分刻みで入れていたので、★待機列が詰まり、
    #   ★新しい回が古い回を蹴っていた（★直近25回で cancelled 22 / success 2）。
    #   ★★さらに実測で1組11分と分かったので、★20分に広げた（★重ならない）。
    - cron: "*/20 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "ab.py"
      - "ab_one.py"
      - ".github/workflows/learn.yml"
permissions:
  contents: write
  actions: write        # ★（自分を呼ぶのはやめた。★残してあるだけ）

concurrency:
  # ★★★同じ group にすると、★私が push するたびに待機中の彼女が蹴られる
  #   （★実測: 37回のうち4回が cancelled。★全部わたしの push が原因）
  #   → ★きっかけごとに group を分ける。★彼女の回は、彼女の回どうしでだけ待つ。
  group: realu-learn-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # ★★★実測（2026-09-09 #352）: ★A（ループ無し・300歩）258秒。★B（2周）はもっと長い。
    #   ★1組で11分前後かかる。★予算15分＋ごはん1分＋余裕＝25分。
    #   ★★1回で1組。★3回に分けて1つのテストが終わる（★途中結果は残るので無駄にならない）。
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ★数字を玄関に置く係は state.yml へ引っ越した（★5分ごと・30秒で終わる）。
      #   ★測る係は1回15分以上かかるので、★数字の新しさを引きずらせない。

      - name: 道具を入れる
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet tokenizers numpy

      # ★★★ごはん（棚）を借りる。★読むだけ。★本物の頭には触らない。
      - name: ごはんを借りる
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FOODKEY: ${{ secrets.REALU_FOOD_KEY }}
        run: |
          mkdir -p work
          if [ -z "$FOODKEY" ]; then echo "★鍵が無い"; exit 0; fi
          if gh release download food -p pantry.enc -D /tmp 2>/dev/null; then
            openssl enc -d -aes-256-cbc -pbkdf2 -in /tmp/pantry.enc \
              -out /tmp/pantry.tgz -pass env:FOODKEY 2>/dev/null \
              && tar xzf /tmp/pantry.tgz -C work && echo "★棚を借りた"
            rm -f /tmp/pantry.enc /tmp/pantry.tgz
          fi
          if gh release download food -p tok.enc -D /tmp 2>/dev/null; then
            openssl enc -d -aes-256-cbc -pbkdf2 -in /tmp/tok.enc \
              -out work/tok.json -pass env:FOODKEY 2>/dev/null || true
            rm -f /tmp/tok.enc
          fi
          if gh release download food -p val.enc -D /tmp 2>/dev/null; then
            openssl enc -d -aes-256-cbc -pbkdf2 -in /tmp/val.enc \
              -out work/val.txt.gz -pass env:FOODKEY 2>/dev/null || true
            rm -f /tmp/val.enc
          fi

      # ★★★勘で決めた設定を、★数字で確かめる。
      #   ★判定は厳しく: ★全部の種で同じ向きに出て、
      #   ★かつ差が種のばらつきより大きい時だけ「効いた」と言う。
      - name: 測る
        env:
          REALU_AB_STEPS: "300"
          REALU_AB_SEEDS: "3"
          REALU_AB_BUDGET: "15"     # ★★1組（A+B）が入る大きさ。★入らない2組目は始めない
        run: |
          if [ ! -d work/pantry ]; then
            echo "★棚がまだ無い。★次の回に"
            exit 0
          fi
          python -u ab.py || true

      # ★★★測った結果を残す（★都合の悪い結果も消さない）
      - name: 結果を残す
        if: always()
        run: |
          if [ ! -f ab_results.json ]; then exit 0; fi
          git config user.name  "realu"
          git config user.email "realu@users.noreply.github.com"
          cp ab_results.json /tmp/ab.json
          for i in 1 2 3; do
            git fetch origin main && git reset --hard origin/main
            cp /tmp/ab.json ab_results.json
            git add ab_results.json
            if git diff --staged --quiet; then break; fi
            git commit -q -m "測った"
            if git push origin HEAD:main; then break; fi
            sleep 5
          done

      # ★★★2026-09-09: 一度これを消したが、★**それが間違いだった**。
      #   ★消した理由は「cron と二重に走って殺し合う」。★だが実際の cancelled 22件は
      #   ★★**ジョブの10分枠を超えた timeout** であって、★二重起動ではなかった。
      #   ★★そして cron はこのリポジトリでほぼ鳴らない（★実測: 直近30回のうち
      #     ★schedule はたった2回。★残り26回は全部この自己呼び出しだった）。
      #   → ★★**心臓はこちら。cron は保険。**
      - name: 次のわたしを呼ぶ
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run learn.yml --ref main || true

      - name: 触れてはいけない所を守る
        if: always()
        run: |
          git checkout -- . || true
          git clean -fd -e work || true
