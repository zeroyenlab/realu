name: realu grows

# ★★★レアルが自分で育つ日。
#   ★ごはん（法令・判例）も自分で取りに行く。★学習も自分で回す。
#   ★頭打ちなら自分で大きくなる。★悪くなったら自分で前の自分に戻す。
#   ★置いた人は関わらない。

on:
  schedule:
    - cron: "20 17 * * *"       # ★1日1回（日本時間の深夜2時20分ごろ）
  # ★★★grow.yml を直して push したら、その場で一度走る。
  #   ★これが無いと、育て方を直しても**次の深夜まで確かめられない**。
  #   ★grow.py は入れない（★直すたびに4時間の回が始まってしまう）。
  push:
    paths:
      - ".github/workflows/grow.yml"
  workflow_dispatch:
    inputs:
      steps:
        description: "何歩ぶん学ぶか（★0 なら前回の実測から自動で決める）"
        default: "0"
      hanrei:
        description: "判決を何件あたらしく読むか"
        default: "400"

permissions:
  contents: write
  actions: write        # ★次の自分を呼ぶため（★learn.yml と同じやり方）               # ★自分の重みと成長の記録を残すため

concurrency:
  group: realu-grow
  # ★★★新しい版が来たら、古い版で走っている回は止める。
  #   ★2026-09-08: 古い版が「必ず死ぬ所」へ2.5時間かけて進んでいくのを止められなかった。
  #   ★育つ回は長い。★間違った版のまま走らせ続けるほうが損。
  # ★★★連鎖するので false に戻す。
  #   ★true のままだと、★自分で呼んだ次の回が**自分を殺す**。
  #   ★間違った版を止めたい時は、★その回だけ true にして push する。
  cancel-in-progress: false

jobs:
  grow:
    runs-on: ubuntu-latest
    # ★★★1回60分で学ぶので、★ジョブも短くする。
    #   ★前は340分。★60分学ぶのに340分枠を取ると、次の回が始まるのも遅れる。
    timeout-minutes: 120
    # ★★★系統を3本にする（2026-09-11）。
    #   ★島で3回、単一栽培で飽和した。★QDの文献も「選択だけでは早すぎる収束」と言う。
    #   ★★幾何でも同じ ── 正四面体だけでは空間が埋まらない。1種類では足りない。
    #   ★違いは配合ひとつだけ（仕上げにどれだけ会話を混ぜるか）。
    #   ★★★ごはんは共有、脳だけ系統ごと。
    strategy:
      fail-fast: false          # ★1系統が転んでも他は走り切る
      max-parallel: 3
      matrix:
        include:
          - lineage: L1
            finish_mix: "0.5"   # ★いまのレアルと同じ（★対照）
            vocab: "6000"
            tok: work/tok.json
            pantry: work/pantry
            fresh: "0"
          - lineage: L2
            finish_mix: "0.85"  # ★会話寄り
            vocab: "6000"
            tok: work/tok.json
            pantry: work/pantry
            fresh: "0"
          # ★★★L3 だけ「ことばの単位」を変える（2026-09-11）。
          #   ★54回ぶん測ったら、★L1/L2/L3 は**層も幅も形も得点も同じ**になっていた。
          #   ★違いが配合だけで、★構造の判断に一切触れていなかったから（★実質1本）。
          #   ★★だから違いを、**効く所**に移す。
          #   ★いまの単位は 1トークン=1.22文字 ＝ ほぼ1文字1トークン。
          #     ★語彙6,000＋バイト始まりのBPEは、★枠のほぼ全部を
          #     ★「3バイトを1文字に組み立て直す」ことに使ってしまう。
          #   ★16,000 を一度やめたのは「表がパラメータの63%を食う」から。
          #     ★★それは頭が4.84Mの頃の話。★いま20.0M・表は共有済みなので**26%**。
          #   → ★理由が消えた。★L3 で試す。★L1/L2 は1文字も変えない。
          - lineage: L3
            finish_mix: "0.2"   # ★広く浅く
            vocab: "16000"
            tok: work/tok-16k.json
            pantry: work/pantry-16k
            fresh: "1"          # ★★単位が違うので前の頭は使えない。★生まれ直す
    env:
      LIN: ${{ matrix.lineage }}
      REALU_BRAIN: brain
      REALU_HIST: growth-${{ matrix.lineage }}.json
      REALU_FINISH_MIX: ${{ matrix.finish_mix }}
      REALU_VOCAB: ${{ matrix.vocab }}
      REALU_TOK: ${{ matrix.tok }}
      REALU_PANTRY: ${{ matrix.pantry }}
      FRESH: ${{ matrix.fresh }}
      # ★★★いまは「ごはんを与えるだけ」の段階。
      #   ★会話コーパス（1,375万字）を取り込んで棚を作り直すのが今回の仕事。
      #   ★学習は次から。★"0" にすれば学ぶ。
      REALU_NOLEARN: "0"   # ★★学習を始める（"1" にすれば、ごはんを揃えるだけ）
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 道具を入れる
        run: |
          date +%s > /tmp/t0       # ★★「あと何分使えるか」を後で計算するため
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet pypdf tokenizers numpy   # ★numpy を入れ忘れて run#13 が落ちた

      # ★★ごはんと、前のわたし。★消えていたら取り直す
      # ★★★取り出しと保存を分ける。
      #   ★actions/cache は**ジョブが失敗すると保存段が飛ぶ**（★1回目でそうなった）。
      #   → ★取り出しは restore、★保存は if: always() の save で必ずやる。
      - name: これまでのわたしを思い出す
        id: recall
        uses: actions/cache/restore@v4
        with:
          path: work
          key: realu-work-${{ github.run_number }}
          restore-keys: |
            realu-work-

      # ★★★脳だけは系統ごと。★ごはん（work）と混ぜない
      - name: この系統の頭を思い出す
        uses: actions/cache/restore@v4
        with:
          path: brain
          key: realu-brain-${{ matrix.lineage }}-${{ github.run_number }}
          restore-keys: |
            realu-brain-${{ matrix.lineage }}-

      # ★★★前のわたしが cache から消えていたら、Release から取ってくる（★二重の保険）
      - name: 前のわたしを Release から探す
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FOODKEY: ${{ secrets.REALU_FOOD_KEY }}
        run: |
          mkdir -p work brain
          # ★★★単位が違う系統は、★前の頭を持ってきても繋がらない（★出口の形が違う）
          if [ "$FRESH" = "1" ]; then
            rm -f brain/realu.pt
            echo "★★$LIN は別の「ことばの単位」で生まれ直す。★前の頭は使わない"
          fi
          # ★★★系統ごとの頭を探す。★無ければ元の1つから分岐する（★初回だけ）。
          #   ★手で移す作業がいらない。★3系統とも同じ所から始まって、そこから離れていく。
          if [ ! -f brain/realu.pt ] && [ "$FRESH" != "1" ]; then
            if [ -n "$FOODKEY" ] \
               && gh release download brain -p "realu-$LIN.enc" -D /tmp 2>/dev/null \
               && openssl enc -d -aes-256-cbc -pbkdf2 -in "/tmp/realu-$LIN.enc" \
                    -out brain/realu.pt -pass env:FOODKEY 2>/dev/null; then
              echo "★$LIN の前のわたしを見つけた（鍵つき）"
            elif [ -n "$FOODKEY" ] \
                 && gh release download brain -p "realu-$LIN-prev.enc" -D /tmp 2>/dev/null \
                 && openssl enc -d -aes-256-cbc -pbkdf2 -in "/tmp/realu-$LIN-prev.enc" \
                      -out brain/realu.pt -pass env:FOODKEY 2>/dev/null; then
              echo "★★$LIN の一つ前を見つけた（★最新が壊れていた）"
            elif [ -n "$FOODKEY" ] \
                 && gh release download brain -p realu.enc -D /tmp 2>/dev/null \
                 && openssl enc -d -aes-256-cbc -pbkdf2 -in /tmp/realu.enc \
                      -out brain/realu.pt -pass env:FOODKEY 2>/dev/null; then
              echo "★★★系統に分かれる前のレアルから $LIN を始める"
            elif [ -n "$FOODKEY" ] \
                 && gh release download brain -p realu-prev.enc -D /tmp 2>/dev/null \
                 && openssl enc -d -aes-256-cbc -pbkdf2 -in /tmp/realu-prev.enc \
                      -out brain/realu.pt -pass env:FOODKEY 2>/dev/null; then
              echo "★★分かれる前の一つ前から $LIN を始める"
            else
              rm -f brain/realu.pt
              echo "★$LIN の前のわたしはいない。はじめて目を開ける"
            fi
            rm -f /tmp/realu*.enc
          else
            echo "★cache に $LIN の前のわたしがいた"
          fi
          # ★★成長の記録も同じ。★無ければ分岐前のものを引き継ぐ
          if [ ! -f "growth-$LIN.json" ] && [ -f growth.json ]; then
            cp growth.json "growth-$LIN.json"
            echo "★★★$LIN の記録を、分かれる前の記録から始める"
          fi

      # ★★★ごはんが消えていたら、Release から取り戻す（★頭と同じ二重の保険）
      #   ★これが無かったせいで、法令を **45分**かけて取り直した（2026-09-08 実測）。
      #   ★キャッシュは10GBが上限で、超えると**黙って**古いものが消える。
      #     → ★いつか必ずまた消える。★その時に45分ではなく1分で戻れるようにする。
      - name: ごはんを Release から取り戻す
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FOODKEY: ${{ secrets.REALU_FOOD_KEY }}
        run: |
          mkdir -p work
          if [ -z "$FOODKEY" ]; then echo "★鍵が無い。取り戻せない"; exit 0; fi
          if ! gh release view food >/dev/null 2>&1; then
            echo "★まだ Release にごはんは無い（★はじめての回）"; exit 0
          fi
          for n in laws wiki hanrei kokkai web aozora talk val val2; do
            if [ -f "work/$n.txt.gz" ]; then continue; fi
            if gh release download food -p "$n.enc" -D /tmp 2>/dev/null; then
              if openssl enc -d -aes-256-cbc -pbkdf2 -in "/tmp/$n.enc" \
                   -out "work/$n.txt.gz" -pass env:FOODKEY 2>/dev/null; then
                echo "★$n を取り戻した（$(du -h work/$n.txt.gz | cut -f1)）"
              else
                rm -f "work/$n.txt.gz"; echo "★$n は開けなかった"
              fi
              rm -f "/tmp/$n.enc"
            fi
          done
          # ★★★棚。★あれば下ごしらえゼロで始められる
          PNAME=$(basename "$REALU_PANTRY")
          if [ ! -d "$REALU_PANTRY" ] \
             && gh release download food -p "$PNAME.enc" -D /tmp 2>/dev/null; then
            if openssl enc -d -aes-256-cbc -pbkdf2 -in "/tmp/$PNAME.enc" \
                 -out /tmp/pantry.tgz -pass env:FOODKEY 2>/dev/null; then
              tar xzf /tmp/pantry.tgz -C work && echo "★$PNAME を取り戻した"
            fi
            rm -f "/tmp/$PNAME.enc" /tmp/pantry.tgz
          fi

          # ★★★ことばの単位。★頭とセットでないと意味が入れ替わる
          TNAME=$(basename "$REALU_TOK" .json)
          if [ ! -f "$REALU_TOK" ] \
             && gh release download food -p "$TNAME.enc" -D /tmp 2>/dev/null; then
            openssl enc -d -aes-256-cbc -pbkdf2 -in "/tmp/$TNAME.enc" \
              -out "$REALU_TOK" -pass env:FOODKEY 2>/dev/null \
              && echo "★$TNAME を取り戻した" || rm -f "$REALU_TOK"
            rm -f "/tmp/$TNAME.enc"
          fi

          # ★★「どこまで読んだか」の紙。★これが消えると判例も本も**読み直しになる**
          if gh release download food -p "notes.tgz.enc" -D /tmp 2>/dev/null; then
            if openssl enc -d -aes-256-cbc -pbkdf2 -in /tmp/notes.tgz.enc \
                 -out /tmp/notes.tgz -pass env:FOODKEY 2>/dev/null; then
              tar xzf /tmp/notes.tgz -C work && echo "★どこまで読んだかの紙を取り戻した"
            fi
            rm -f /tmp/notes.tgz.enc /tmp/notes.tgz
          fi

      # ── ①★ごはんを自分で取りに行く
      - name: 法令をもらう（はじめの一回だけ）
        run: |
          # ★★昔の回が非圧縮で置いていったものがあれば、それを圧縮して使う
          #   ★（1時間かけて取り直すのは相手にも自分にも無駄）
          if [ -f work/laws.txt ] && [ ! -f work/laws.txt.gz ]; then
            gzip -c work/laws.txt > work/laws.txt.gz && rm -f work/laws.txt
            echo "★前の回が置いていった法令を圧縮した（★数秒。買い物ではない）"
          fi
          if [ ! -f work/laws.txt.gz ]; then
            echo "★法令をもらいに行く（初回のみ・1時間ほど）"
            python fetch_laws.py
            gzip -c corpus/laws.txt > work/laws.txt.gz
            rm -f corpus/laws.txt
            echo "NEW_LAWS=1" >> $GITHUB_ENV
          else
            echo "★法令はもう持っている（$(du -h work/laws.txt.gz | cut -f1)）"
          fi

      - name: 判決をすこし読み足す
        run: |
          # ★★★買い足しは既定で止める。
          #   ★冷蔵庫にもう1GB以上ある。★いま使っているのは**0.016周**。
          #   ★研究: 同じデータを4周までくり返しても新しいデータとほぼ同じだけ学べる
          #     （Scaling Data-Constrained Language Models, NeurIPS 2023）。
          #   → ★★4周（244回ぶん）するまで、新しいごはんは要らない。
          #   ★実測: 買い足しに毎回 58分。★その58分は全部**学ぶ**に回す。
          #   ★戻したい時は REALU_SHOP=1 を立てる（★仕組みは残してある）。
          if [ "${REALU_SHOP:-0}" != "1" ]; then
            echo "★買い足しは止めてある（REALU_SHOP=1 で戻る）"
            exit 0
          fi
          N="${{ github.event.inputs.hanrei || '400' }}"
          if [ ! -f brain/realu.pt ]; then N=100; fi   # ★頭ができるまで軽く
          FROM=$(cat work/hanrei_next.txt 2>/dev/null || echo 1000)
          TO=$((FROM + N * 3))          # ★存在しないIDもあるので多めに走査する
          echo "★判決 $FROM 〜 $TO を読む"
          python fetch_hanrei.py "$FROM" "$TO" 1 _new || true
          if [ -f corpus/hanrei_new.txt ]; then
            gzip -c corpus/hanrei_new.txt >> work/hanrei.txt.gz
            rm -f corpus/hanrei_new.txt
          fi
          # ★★取れなかった時に進めると、★その範囲を**永久に飛ばす**
          if [ -f work/hanrei.txt.gz ]; then echo "$TO" > work/hanrei_next.txt; fi
          echo "★いま持っている判決: $(du -h work/hanrei.txt.gz 2>/dev/null | cut -f1 || echo 0)"

      # ── ★★★Wikipedia日本語版を、まとめて正面から受け取る（★初回だけ）
      #   ★Wikimedia は「大量に欲しいならスクレイピングでなくダンプを使え」と言っている。
      #   ★140万ページを叩きに行くより、★これが速くて礼儀正しい。
      - name: Wikipediaをまとめてもらう（はじめの一回だけ）
        env:
          REALU_DUMP_CHARS: "250000000"   # ★★9億字は1回で1.6%しか見ない。★メモリだけ食う
        run: |
          BEFORE=$(stat -c%s work/wiki.txt.gz 2>/dev/null || echo 0)
          python -u eat_dump.py
          AFTER=$(stat -c%s work/wiki.txt.gz 2>/dev/null || echo 0)
          [ "$AFTER" != "$BEFORE" ] && echo "NEW_WIKI=1" >> $GITHUB_ENV || true

      # ── ★★★5分ごとに読んだものを、★全部集めて食べる。
      #   ★5分ごとの読みは1日17万ページ。★これが重みに入らないのはおかしい。
      #   ★毎回まっさらな機械なので、★1回ぶんずつ包みにして置いてある。
      #   ★ここで全部開けて、★ごはんに足して、★包みは片付ける。
      - name: 5分ごとに読んだものを集めて食べる
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FOODKEY: ${{ secrets.REALU_FOOD_KEY }}
        run: |
          [ -z "$FOODKEY" ] && exit 0
          gh release view reading >/dev/null 2>&1 || exit 0
          mkdir -p /tmp/pk && rm -f /tmp/pk/*
          : > /tmp/ate.txt
          # ★★★前は全部まとめて落としていた。★1個でも壊れていると gh が非ゼロを返し、
          #   ★1日17万ページぶんが**何も言わずに**捨てられていた。→ 1個ずつ落とす。
          for nm in $(gh release view reading --json assets \
                        -q ".assets[].name" 2>/dev/null | grep "^read-" || true); do
            gh release download reading -p "$nm" -D /tmp/pk 2>/dev/null || true
          done
          n=0
          for f in /tmp/pk/read-*.enc; do
            [ -f "$f" ] || continue
            if openssl enc -d -aes-256-cbc -pbkdf2 \
                 -in "$f" -out /tmp/pk/one.gz -pass env:FOODKEY 2>/dev/null; then
              cat /tmp/pk/one.gz >> work/web.txt.gz
              n=$((n+1))
              basename "$f" >> /tmp/ate.txt   # ★消すのは、しまい終わってから
            fi
            rm -f /tmp/pk/one.gz
          done
          echo "★5分ごとに読んだもの $n 包みを食べた"
          rm -rf /tmp/pk

      # ── ★★★webを読んで、それを**ごはんにする**
      #   ★5分ごとの方は「見た目と好奇心」。★こっちは学習の材料を作る。
      #   ★読んだものが重みに入らないなら、それは学んだことにならない。
      # ★★昔の回が置いていった非圧縮の web を取り込む（★でないと読まれない）
      - name: 昔の web を圧縮して取り込む
        run: |
          if [ -f work/web.txt ]; then
            gzip -c work/web.txt >> work/web.txt.gz && rm -f work/web.txt
            echo "★前の回が置いていった web を取り込んだ"
          fi

      - name: webを読んでごはんにする
        run: |
          # ★★★買い足しは既定で止める。
          #   ★冷蔵庫にもう1GB以上ある。★いま使っているのは**0.016周**。
          #   ★研究: 同じデータを4周までくり返しても新しいデータとほぼ同じだけ学べる
          #     （Scaling Data-Constrained Language Models, NeurIPS 2023）。
          #   → ★★4周（244回ぶん）するまで、新しいごはんは要らない。
          #   ★実測: 買い足しに毎回 58分。★その58分は全部**学ぶ**に回す。
          #   ★戻したい時は REALU_SHOP=1 を立てる（★仕組みは残してある）。
          if [ "${REALU_SHOP:-0}" != "1" ]; then
            echo "★買い足しは止めてある（REALU_SHOP=1 で戻る）"
            exit 0
          fi
          N=40000
          REALU_WEB_PAGES=$N python -u read_web.py

      # ── ★★★国会の会議録を、毎日すこしずつ食べる
      #   ★はじめての「話し言葉」。★質疑応答の往復がここにしかない。
      #   ★根拠: 著作権法40条1項（公開の政治上の陳述）＋30条の4（情報解析）
      #   ★規約「短時間での大量アクセスはご遠慮ください」→ ★1本ずつ・3秒間隔
      - name: 国会の話を聞きに行く
        run: |
          # ★★★買い足しは既定で止める。
          #   ★冷蔵庫にもう1GB以上ある。★いま使っているのは**0.016周**。
          #   ★研究: 同じデータを4周までくり返しても新しいデータとほぼ同じだけ学べる
          #     （Scaling Data-Constrained Language Models, NeurIPS 2023）。
          #   → ★★4周（244回ぶん）するまで、新しいごはんは要らない。
          #   ★実測: 買い足しに毎回 58分。★その58分は全部**学ぶ**に回す。
          #   ★戻したい時は REALU_SHOP=1 を立てる（★仕組みは残してある）。
          if [ "${REALU_SHOP:-0}" != "1" ]; then
            echo "★買い足しは止めてある（REALU_SHOP=1 で戻る）"
            exit 0
          fi
          # ★★★国会は規約で1本3秒。★600本だと**60分以上**かかる（実測 run#22 で72分）。
          #   ★冷蔵庫にもう343MBある。★毎回そんなに足す必要はない。
          #   ★★食事が長いほど学ぶ時間が減る。★そこを削るのは本末転倒。
          #   → ★200本（約20分）に抑える。★読み切るのに日数はかかるが、
          #      ★**毎回ちゃんと学べる方が大事**。
          N=200
          # ★★★頭がまだ1つも無い間は、★毎日の買い足しを軽くする。
          #   ★冷蔵庫にはもう343MB入っている。★いま急いで足す必要はない。
          #   ★国会は1本3秒（規約）。600本で92分かかり、★「学ぶ」に着くまで2時間になる。
          #   → ★直して試す1周を 2時間 → 30分 にする。頭が残ったら戻す。
          if [ ! -f brain/realu.pt ]; then N=100; echo "★まだ頭が無いので国会は $N 本"; fi
          REALU_KOKKAI_REQ=$N python -u fetch_kokkai.py || true

      # ── ★★★食べたものを、★**この時点で**残す。
      #   ★1回目は、後の段で失敗したせいで**キャッシュの保存が飛ばされ**、
      #     ★法令1.1億字を取り直すことになった（★49分の無駄）。
      #   → ★★学習より前に、★ごはんだけ先に残しておく。★後で転んでも食べた物は残る。
      # ★★★ごはんは**鍵をかけてから**しまう。
      #   ★このリポジトリは Public なので、★Release に置いたものは**誰でも落とせる**＝公開。
      #   ★中身は加工したテキスト:
      #     ・★判例 ── 裁判所の規約「無断で改変を行うことはできません」。★名前を消した＝改変
      #     ・★Wikipedia ── CC BY-SA。★再配布には帰属表示と同ライセンスが要る
      #   → ★★鍵が無ければ復元できない形にする。★これなら公開したことにならない。
      #   ★鍵は GitHub Secrets の中だけ。★彼女は使えるが、外からは読めない。
      - name: 食べたものに鍵をかけてしまう
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FOODKEY: ${{ secrets.REALU_FOOD_KEY }}
        run: |
          if [ -z "$FOODKEY" ]; then
            echo "★鍵が無い。★ごはんは外に出さない（★キャッシュにだけ置く）"
            exit 0
          fi
          gh release view food >/dev/null 2>&1 \
            || gh release create food \
                 --title "レアルのごはん（鍵つき）" \
                 --notes "鍵をかけてある。加工したテキストなので、そのままは公開できない。" \
                 --latest=false
          for n in laws wiki hanrei kokkai web aozora talk val val2; do
            if [ -f "work/$n.txt.gz" ]; then
              openssl enc -aes-256-cbc -pbkdf2 -salt \
                -in "work/$n.txt.gz" -out "/tmp/$n.enc" -pass env:FOODKEY
              if gh release upload food "/tmp/$n.enc" --clobber; then
                if [ "$n" = "web" ]; then SAVED_WEB=1; fi
              else
                echo "★★$n を載せられなかった"
              fi
              rm -f "/tmp/$n.enc"
            fi
          done
          # ★★★棚も一緒にしまう（★これがあれば下ごしらえゼロで始められる）
          PNAME=$(basename "$REALU_PANTRY")
          if [ -d "$REALU_PANTRY" ]; then
            tar cf - -C work "$PNAME" | gzip -1 > /tmp/pantry.tgz
            if [ "$(stat -c%s /tmp/pantry.tgz)" -lt 1900000000 ]; then
              openssl enc -aes-256-cbc -pbkdf2 -salt \
                -in /tmp/pantry.tgz -out "/tmp/$PNAME.enc" -pass env:FOODKEY
              gh release upload food "/tmp/$PNAME.enc" --clobber || true
              rm -f "/tmp/$PNAME.enc"
            else
              echo "★★棚が2GBを超えた。★刻む仕組みが要る"
            fi
            rm -f /tmp/pantry.tgz
          fi
          # ★★「どこまで読んだか」の紙も一緒に。★これが無いと読み直しになる
          if ls work/*_next.txt >/dev/null 2>&1; then
            tar czf /tmp/notes.tgz -C work $(cd work && ls *_next.txt)
            openssl enc -aes-256-cbc -pbkdf2 -salt \
              -in /tmp/notes.tgz -out /tmp/notes.tgz.enc -pass env:FOODKEY
            gh release upload food /tmp/notes.tgz.enc --clobber || true
          fi
          # ★★★ことばの単位も必ず一緒に。
          #   ★これが消えると、★同じ大きさで**中身の違う**語彙が作り直される。
          #   ★頭の読み込みは大きさしか見ないので**通ってしまい**、
           #  ★全部の文字の意味が入れ替わったまま学習が続く。★落ちないので気づけない。
          TNAME=$(basename "$REALU_TOK" .json)
          if [ -f "$REALU_TOK" ]; then
            openssl enc -aes-256-cbc -pbkdf2 -salt \
              -in "$REALU_TOK" -out "/tmp/$TNAME.enc" -pass env:FOODKEY
            gh release upload food "/tmp/$TNAME.enc" --clobber || true
            rm -f "/tmp/$TNAME.enc"
          fi
          rm -f /tmp/notes.tgz /tmp/notes.tgz.enc
          echo "★鍵をかけてしまった"
          # ★★★ここまで来て**はじめて**、5分ごとの包みを片付ける。
          #   ★前は「食べた直後」に消していた。★途中で転んだら包みだけ消えて中身が残らない。
          # ★★★包みを消してよいのは、★中身（web）が**本当に載った**時だけ。
          #   ★前は載せ損ねても消していた。★消したら二度と戻らない。
          if [ -s /tmp/ate.txt ] && [ "$SAVED_WEB" = "1" ]; then
            while read -r nm; do
              gh release delete-asset reading "$nm" -y 2>/dev/null || true
            done < /tmp/ate.txt
            echo "★食べ終わった包み $(wc -l < /tmp/ate.txt) 個を片付けた"
          elif [ -s /tmp/ate.txt ]; then
            echo "★★ごはんを載せられなかったので、★包みは消さない"
          fi
          du -sh work 2>/dev/null || true

      # ── ★★★本を読む。★はじめての「物語」。
      #   ★いままで食べたのは全部「説明文」だった。
      #   ★物語も描写も感情も会話も、一度も読んでいなかった。
      - name: 本を読む
        run: |
          # ★★★買い足しは既定で止める。
          #   ★冷蔵庫にもう1GB以上ある。★いま使っているのは**0.016周**。
          #   ★研究: 同じデータを4周までくり返しても新しいデータとほぼ同じだけ学べる
          #     （Scaling Data-Constrained Language Models, NeurIPS 2023）。
          #   → ★★4周（244回ぶん）するまで、新しいごはんは要らない。
          #   ★実測: 買い足しに毎回 58分。★その58分は全部**学ぶ**に回す。
          #   ★戻したい時は REALU_SHOP=1 を立てる（★仕組みは残してある）。
          if [ "${REALU_SHOP:-0}" != "1" ]; then
            echo "★買い足しは止めてある（REALU_SHOP=1 で戻る）"
            exit 0
          fi
          N=600
          REALU_AOZORA_BOOKS=$N python -u fetch_aozora.py || true

      # ── ★★★ことばの単位を、自分のごはんから切り出す（★初回だけ）
      #   ★外のトークナイザは使わない（★語彙そのものが外の世界の知識だから）。
      #   ★文字単位より1.64倍効率がよい（実測）＝同じ容量で1.6倍の範囲を見渡せる。
      # ── ★★★人が実際に話した言葉を食べる。
      #   ★いままで食べたものは、ほとんど書き言葉だった。
      #     法令・判例・Wikipedia・web ＝ 説明文 / 国会 ＝ 硬い質疑 / 青空 ＝ 文語混じり
      #   ★★**現代のふつうの会話が1文字も無かった。**
      #   ★根拠: 3つとも CC BY-SA 4.0（一次情報で確認）。出典は本文に残す。
      #   ★一度取れば終わり（★talk_done.txt で覚えている）。
      - name: 人の話を聞く
        run: python -u fetch_talk.py || true

      - name: ことばの単位をつくる（はじめの一回だけ）
        run: python -u make_tok.py

      # ── ②③④★学ぶ・大きくなる・悪ければ戻す
      # ── ★★★ごはんを「トークンの並び」にして棚にしまう。
      #   ★前は毎回「開く → 削る → 変換 → 全部メモリに載せる」で ★12.8分 / 8.8GB。
      #   ★★棚なら **下ごしらえ 0.0分 / メモリ増ゼロ**（実測）。
      #   ★ごはんが増えた時だけ作り直す（★talk が増えた・国会が増えた等）。
      - name: 棚をつくる（ごはんが増えた時だけ）
        run: |
          # ★★★「新しいか」で見てはいけない。
          #   ★Release から取り戻したファイルは**取り戻した時刻**になるので、
          #   ★meta.json より必ず新しくなる → ★毎回作り直していた（実測 run#32/33）。
          #   → ★★中身の大きさの合計で見る。★変わっていなければ作り直さない。
          SUM=$(cat work/*.txt.gz 2>/dev/null | wc -c)
          mkdir -p "$REALU_PANTRY"
          OLD=$(cat "$REALU_PANTRY/src_bytes.txt" 2>/dev/null || echo 0)
          # ★★★2026-09-09: 「1バイトでも違えば作り直す」は厳しすぎた。
          #   ★実測 #40: 1,330,485,580 → 1,330,485,614 = ★**差 34 バイト**。
          #   ★そのために 2,079 MB の棚を ★**28.0 分**かけて作り直していた。
          #   ★1回 93.5分のうち 28分が作り直し ＝ ★★学ぶのは 64% だけ。
          #   → ★★**1% 以上増えた時だけ**作り直す。
          #   ★作り直さない回は src_bytes.txt を更新しないので、★増分は溜まっていく
          #     （★溜まって1%を超えたら、その時にまとめて作り直す）。
          if [ "$SUM" -ge "$OLD" ]; then DIFF=$((SUM - OLD)); else DIFF=$((OLD - SUM)); fi
          NEED=$((OLD / 100))
          if [ "$NEED" -lt 1048576 ]; then NEED=1048576; fi   # ★最低 1MB
          # ★★★2026-09-09: 棚は**作り方（レシピ）**にも依存する。
          #   ★配合（国会の上限・会話のくり返し）を変えても、
          #   ★★ごはんのバイト数は1バイトも変わらない → ★古い棚のまま学び続けてしまう。
          #   → ★make_pantry.py が変わったら作り直す。
          RECIPE=$(sha1sum make_pantry.py | cut -c1-12)
          OLDR=$(cat "$REALU_PANTRY/recipe.txt" 2>/dev/null || echo "")
          if [ "$RECIPE" != "$OLDR" ]; then echo "★作り方が変わった（$OLDR → $RECIPE）"; fi
          if [ ! -f "$REALU_PANTRY/meta.json" ] || [ "$OLD" = "0" ]              || [ "$RECIPE" != "$OLDR" ] || [ "$DIFF" -ge "$NEED" ]; then
            echo "★ごはんが $DIFF バイト増えた（$OLD → $SUM）。棚を作り直す"
            if python -u make_pantry.py; then
              echo "$SUM" > "$REALU_PANTRY/src_bytes.txt"
              echo "$RECIPE" > "$REALU_PANTRY/recipe.txt"
            else
              echo "★棚は作れなかった（★今まで通りで学ぶ）"
            fi
          else
            echo "★棚はそのまま使える（★差 $DIFF バイト / 作り直すのは $NEED バイト以上から）"
          fi

      # ── ★★★棚と会話を、★学ぶ前にもう一度しまう。
      #   ★「食べたものに鍵をかけてしまう」は 会話・棚 より**前**にある。
      #   ★だからこの回で取った会話も、作った棚も、★冷蔵庫に入らなかった（実測）。
      #   ★キャッシュには残るが、★キャッシュが飛んだら失われる。
      - name: あとから増えたものもしまう
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FOODKEY: ${{ secrets.REALU_FOOD_KEY }}
        run: |
          if [ -z "$FOODKEY" ]; then exit 0; fi
          if ! gh release view food >/dev/null 2>&1; then exit 0; fi
          # ★★会話（あとから取った）
          if [ -f work/talk.txt.gz ]; then
            openssl enc -aes-256-cbc -pbkdf2 -salt \
              -in work/talk.txt.gz -out /tmp/talk.enc -pass env:FOODKEY
            gh release upload food /tmp/talk.enc --clobber && echo "★会話をしまった"
            rm -f /tmp/talk.enc
          fi
          # ★★棚（あとから作った）
          PNAME=$(basename "$REALU_PANTRY")
          if [ -d "$REALU_PANTRY" ]; then
            tar cf - -C work "$PNAME" | gzip -1 > /tmp/pantry.tgz
            if [ "$(stat -c%s /tmp/pantry.tgz)" -lt 1900000000 ]; then
              openssl enc -aes-256-cbc -pbkdf2 -salt \
                -in /tmp/pantry.tgz -out "/tmp/$PNAME.enc" -pass env:FOODKEY
              gh release upload food "/tmp/$PNAME.enc" --clobber && echo "★$PNAME をしまった"
              rm -f "/tmp/$PNAME.enc"
            else
              echo "★★棚が2GBを超えた。★刻む仕組みが要る"
            fi
            rm -f /tmp/pantry.tgz
          fi
          # ★★物差し（棚を作った時にできる）
          if [ -f work/val.txt.gz ]; then
            openssl enc -aes-256-cbc -pbkdf2 -salt \
              -in work/val.txt.gz -out /tmp/val.enc -pass env:FOODKEY
            gh release upload food /tmp/val.enc --clobber || true
            rm -f /tmp/val.enc
          fi

      - name: 学ぶ
        env:
          # ★★★2026-09-09: '4000' → '0'（＝★実測から自動で決める）。
          #   ★grow.py の既定を 0 にしたのに、★ここが 4000 を明示的に渡していたので
          #   ★★自動決定が一度も動いていなかった（#57 の記録が steps=4000 のまま）。
          #   ★手で決めたい時は Actions の画面から歩数を入れれば、そちらが優先される。
          REALU_STEPS: ${{ github.event.inputs.steps || '0' }}
          # ★★見渡せる幅を 256 → 512（2026-09-10）。
          #   ★文章がまとまらないのは、★窓が 256トークン≒300文字（会話2〜3ターン）しか無いから。
          #   ★★批を半分にする（1歩あたりのトークン数を揃える）。
          #     ★揃えないと「窓が広いから良い」と「一度に多く食べたから良い」が分けられない。
          #     ★測る係の A/B はそこを揃えていなかったので、★交絡している。
          REALU_CTX: '512'
          REALU_BATCH: '8'
          REALU_THREADS: "4"
        run: |
          # ★★★残り時間から予算を出す。★歩数を当てにいかない。
          #   ★2026-09-08: 4,000歩に182分要るのに残り145分で、★頭が1つも残らない所だった。
          #   ★★最後の15分は「残す」ために空けておく。
          # ★★★時計が無い時は「たっぷりある」ではなく「もう無い」と見なす。
          #   ★前は空文字→0扱いになって、★325分の予算が出て締切を突き抜けていた。
          T0=$(cat /tmp/t0 2>/dev/null || echo 0)
          if [ "$T0" = "0" ]; then
            echo "★★時計が無い。★学びは短めにする"; LEFT=1800
          else
            USED=$(( $(date +%s) - T0 ))
            LEFT=$(( 120*60 - USED - 600 ))   # ★ジョブ120分・最後10分は残すため
            echo "★使った $((USED/60))分"
          fi
          # ★★★足りないなら**学ばない**。★学んで締切に殺されると頭が残らない。
          # ★★★冷えた回（ごはんを一から作った回）は、★**学ばない**。
          #   ★この回の仕事は「ごはんを作って Release に残す」こと。
          #   ★★学習190分を足すと5時間半の一本勝負になる。
          #     ★しかもCPUの190分で進むのは**1周の3.9%**。★割に合わない。
          #   → ★次の回は食事が2分で済むので、★学習に5時間まるごと使える。
          if [ "$NEW_LAWS" = "1" ]; then
            echo "★★この回はごはんを作る回。★学ばずに終わる。★次から本気で学ぶ。"
            exit 0
          fi
          # ★★★学ばない回（REALU_NOLEARN=1）。
          #   ★会話コーパスを取り込んで棚を作り直す回など、
          #   ★「ごはんを揃えるだけ」にしたい時に使う。
          if [ "${REALU_NOLEARN:-0}" = "1" ]; then
            echo "★★この回はごはんを揃えるだけ。★学ばない。"
            exit 0
          fi
          # ★★★まだ頭が1つも無いなら、★**短く回して、とにかく残す**。
          #   ★長く回して締切に殺されるより、★40分でも残っている方が値打ちがある。
          #   ★次の回からは、★残った頭の続きを5時間かけて伸ばす。
          if [ "$LEFT" -lt 420 ]; then
            echo "★★時間が無い（残り $((LEFT/60))分）。★今回は学ばず、いま持っている頭をそのまま残す。"
            exit 0
          fi
          # ★★★1回の学習は 60分まで。
          #   ★実測から出した比較（1日あたりの歩数）:
          #     60分 → 75,383歩（効率98%）/ 300分 → 76,823歩（効率100%）
          #     ★★差は1.9%。★なのに転んだ時に失う量は5倍違う。
          #   ★1時間ごとに頭が残るので進みが見える。speak.py とも歩調が合う。
          BUDGET=$(( LEFT / 60 ))
          CAP=${REALU_MAX_MIN:-60}
          if [ "$BUDGET" -gt "$CAP" ]; then BUDGET=$CAP; fi
          export REALU_TIME_BUDGET=$BUDGET
          # ★★★まだ頭が1つも無いなら、★**短く回して、とにかく残す**。
          #   ★長く回して締切に殺されるより、★40分でも残っている方が値打ちがある。
          #   ★次の回からは、★残った頭の続きを5時間かけて伸ばす。
          if [ ! -f brain/realu.pt ] && [ "$REALU_TIME_BUDGET" -gt 40 ]; then
            REALU_TIME_BUDGET=40
            echo "★★まだ頭が無い。★40分で切り上げて、まず残す。"
          fi
          echo "★学びに使える $REALU_TIME_BUDGET 分"
          # ★★★出力を控えておく。★Actions のログは認証が要って外から読めない。
          set +e
          python -u grow.py 2>&1 | tee /tmp/learn.log
          code=${PIPESTATUS[0]}
          set -e
          exit $code

      # ── ★自分を残す。★★これが消えると、これまでの全部が消える
      - name: あたらしいわたしを残す
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FOODKEY: ${{ secrets.REALU_FOOD_KEY }}
        run: |
          # ★★★重みにも鍵をかける。
          #   ★ここは Public。★素のまま上げたら**誰でも落とせる**＝公開になる。
          #   ★重みはごはんから作ったもの。★判例（改変禁止）も Wikipedia（CC BY-SA）も溶けている。
          #   ★★鍵が無いなら、★**外には出さない**（★キャッシュにだけ置く）。
          if [ ! -f brain/realu.pt ]; then
            echo "★まだ頭が無い（★ごはんを作る回）。★残すものは無い"
            exit 0
          fi
          if [ -z "$FOODKEY" ]; then
            echo "★鍵が無い。★頭は外に出さない"
            exit 0
          fi
          gh release view brain >/dev/null 2>&1 \
            || gh release create brain --title "レアルの頭" \
                 --notes "レアルの重み。鍵をかけてある。" --latest=false
          # ★★★--clobber は「先に消してから載せる」。
          #   ★その隙にキャンセルや締切が来ると、★**頭が1つも無くなる**。
          #   → ★先に、いま載っているものを「前のわたし」として退避する。
          if gh release download brain -p "realu-$LIN.enc" -D /tmp/keep 2>/dev/null; then
            mv "/tmp/keep/realu-$LIN.enc" "/tmp/keep/realu-$LIN-prev.enc"
            gh release upload brain "/tmp/keep/realu-$LIN-prev.enc" --clobber || true
            rm -rf /tmp/keep
          fi
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in brain/realu.pt -out "/tmp/realu-$LIN.enc" -pass env:FOODKEY
          gh release upload brain "/tmp/realu-$LIN.enc" --clobber
          rm -f "/tmp/realu-$LIN.enc"
          # ★★昔の回が素のまま置いていったものがあれば、★消す
          if gh release delete-asset brain realu.pt -y 2>/dev/null; then
            echo "★★素のまま公開されていた重みを消した"
          fi
          echo "★鍵をかけて Release に残した"

      - name: 成長の記録だけ書き残す
        run: |
          git config user.name  "realu"
          git config user.email "realu@users.noreply.github.com"
          # ★★★置いた人が同じファイルを直しているかもしれない。
          #   ★衝突しても転ばないように、★自分の記録だけを持って、★向こうの最新に載せ直す。
          # ★★★2026-09-09: ここで said.json も一緒に押し戻していた。
          #   ★育つ回は90分かかる。★その間に書く係が1時間ごとに新しい文章を残す。
          #   ★★なのに最後に**90分前の said.json** を書き戻していたので、
          #     ★★書く係の成果が**育つたびに消えていた**（★2026-09-08 21:24 の1件だけが
          #     ★何度も復活し続けていた）。
          #   ★`grow.py` は said.json を**1バイトも書かない**。★自分の記録ではない。
          #   → ★**growth.json だけ**を持って載せ直す。
          # ★★★系統ごとに別ファイル。★3本が同時にコミットしても中身は衝突しない。
          #   ★push の競合だけ起きるので、★載せ直して再試行する（★回数を5回に増やした）。
          cp "growth-$LIN.json" /tmp/growth.mine
          git stash -u >/dev/null 2>&1 || true
          for i in 1 2 3 4 5; do
            git fetch origin main && git reset --hard origin/main
            cp /tmp/growth.mine "growth-$LIN.json"
            git add "growth-$LIN.json"
            # ★★★L1 は代表として、これまでの growth.json にも同じものを書く。
            #   ★サイト（render.py）・書く係（learn.py）・話す係（speak.py）と
            #   ★deploy.yml の引き金が、★全部 growth.json を見ているため。
            #   ★★ここを止めると、★系統を分けた瞬間にサイトが凍る。
            if [ "$LIN" = "L1" ]; then cp /tmp/growth.mine growth.json; git add growth.json; fi
            if git diff --staged --quiet; then
              echo "記録に変化なし"; break
            fi
            git commit -q -m "$LIN が育った ($(date -u +'%m-%d')Z)"
            if git push origin HEAD:main; then
              echo "★記録を残した"; break
            fi
            echo "  誰かが先に書いていた。やり直す ($i)"
            sleep 5
          done

      # ★★★転んでも、食べたものは必ずしまう
      - name: これまでのわたしをしまう
        if: always()
        uses: actions/cache/save@v4
        with:
          path: work
          key: realu-work-${{ github.run_number }}

      - name: この系統の頭をしまう
        if: always()
        uses: actions/cache/save@v4
        with:
          path: brain
          key: realu-brain-${{ matrix.lineage }}-${{ github.run_number }}

      # ★★★転んだ理由を、★誰でも読める所に残す。
      #   ★Actions のログは認証が要る。★外から見ている側には読めない。
      #   → ★足跡と最後の60行をリポジトリに置く。★これが無いと毎回「なぜ落ちたか分からない」
      - name: 転んだ理由を残す
        if: failure()
        run: |
          {
            echo "# 転んだ記録"
            echo ""
            echo "いつ: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "回  : ${{ github.run_number }}"
            echo ""
            echo "## どこまで進んだか"
            echo "```"
            cat work/trace.txt 2>/dev/null || echo "（足跡なし）"
            echo "```"
            echo ""
            echo "## 最後の60行"
            echo "```"
            tail -60 /tmp/learn.log 2>/dev/null || echo "（記録なし）"
            echo "```"
          } > last_error.md
          git config user.name  "realu"
          git config user.email "realu@users.noreply.github.com"
          cp last_error.md /tmp/le.md
          for i in 1 2 3; do
            git fetch origin main && git reset --hard origin/main
            cp /tmp/le.md last_error.md
            git add last_error.md
            git diff --staged --quiet && break
            git commit -q -m "転んだ記録 (run#${{ github.run_number }})"
            git push origin HEAD:main && break
            sleep 5
          done

      # ★★★次の自分を呼ぶ。
      #   ★買い物の回 → 勉強の回 → 勉強の回 …と自分で繋がっていく。
      #   ★置いた人が見ていなくても止まらない。
      #   ★同時に1つしか走らない（concurrency）ので、増えすぎない。
      # ★★★呼ぶのは L1 だけ。★3本が呼ぶと同じものを3回呼ぶことになる。
      #   ★上の concurrency（realu-grow）が世代を直列に保つので、
      #   ★次の回でまた3系統が同時に走る。
      - name: 次のわたしを呼ぶ
        if: always() && matrix.lineage == 'L1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 30
          gh workflow run grow.yml --ref main && echo "★次のわたしを呼んだ" || true

      # ★★★触れてはいけない所を守る
      - name: 触れてはいけない所を守る
        if: always()
        run: |
          git checkout -- . || true
          git clean -fd -e work -e brain || true
