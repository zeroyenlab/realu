name: realu grows

# ★★★レアルが自分で育つ日。
#   ★ごはん（法令・判例）も自分で取りに行く。★学習も自分で回す。
#   ★頭打ちなら自分で大きくなる。★悪くなったら自分で前の自分に戻す。
#   ★置いた人は関わらない。

on:
  schedule:
    - cron: "20 17 * * *"       # ★1日1回（日本時間の深夜2時20分ごろ）
  # ★★★grow.yml を直して push したら、その場で一度走る。
  #   ★これが無いと、育て方を直しても**次の深夜まで確かめられない**。
  #   ★grow.py は入れない（★直すたびに4時間の回が始まってしまう）。
  push:
    paths:
      - ".github/workflows/grow.yml"
  workflow_dispatch:
    inputs:
      steps:
        description: "何歩ぶん学ぶか"
        default: "4000"
      hanrei:
        description: "判決を何件あたらしく読むか"
        default: "400"

permissions:
  contents: write
  actions: write        # ★次の自分を呼ぶため（★learn.yml と同じやり方）               # ★自分の重みと成長の記録を残すため

concurrency:
  group: realu-grow
  # ★★★新しい版が来たら、古い版で走っている回は止める。
  #   ★2026-09-08: 古い版が「必ず死ぬ所」へ2.5時間かけて進んでいくのを止められなかった。
  #   ★育つ回は長い。★間違った版のまま走らせ続けるほうが損。
  # ★★★連鎖するので false に戻す。
  #   ★true のままだと、★自分で呼んだ次の回が**自分を殺す**。
  #   ★間違った版を止めたい時は、★その回だけ true にして push する。
  cancel-in-progress: false

jobs:
  grow:
    runs-on: ubuntu-latest
    timeout-minutes: 340        # ★Actionsの上限（6時間）の内側に収める
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 道具を入れる
        run: |
          date +%s > /tmp/t0       # ★★「あと何分使えるか」を後で計算するため
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet pypdf tokenizers

      # ★★ごはんと、前のわたし。★消えていたら取り直す
      # ★★★取り出しと保存を分ける。
      #   ★actions/cache は**ジョブが失敗すると保存段が飛ぶ**（★1回目でそうなった）。
      #   → ★取り出しは restore、★保存は if: always() の save で必ずやる。
      - name: これまでのわたしを思い出す
        id: recall
        uses: actions/cache/restore@v4
        with:
          path: work
          key: realu-work-${{ github.run_number }}
          restore-keys: |
            realu-work-

      # ★★★前のわたしが cache から消えていたら、Release から取ってくる（★二重の保険）
      - name: 前のわたしを Release から探す
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FOODKEY: ${{ secrets.REALU_FOOD_KEY }}
        run: |
          mkdir -p work
          if [ ! -f work/realu.pt ]; then
            # ★鍵つきを先に探す
            if [ -n "$FOODKEY" ] \
               && gh release download brain -p realu.enc -D /tmp 2>/dev/null \
               && openssl enc -d -aes-256-cbc -pbkdf2 -in /tmp/realu.enc \
                    -out work/realu.pt -pass env:FOODKEY 2>/dev/null; then
              echo "★Release から前のわたしを見つけた（鍵つき）"
            # ★★昔の回が素のまま置いていったもの。★引き継いでから、上で消す
            elif [ -n "$FOODKEY" ] \
                 && gh release download brain -p realu-prev.enc -D /tmp 2>/dev/null \
                 && openssl enc -d -aes-256-cbc -pbkdf2 -in /tmp/realu-prev.enc \
                      -out work/realu.pt -pass env:FOODKEY 2>/dev/null; then
              echo "★★一つ前のわたしを見つけた（★最新が壊れていた）"
            elif gh release download brain -p realu.pt -D work 2>/dev/null; then
              echo "★Release から前のわたしを見つけた（素のまま。★あとで鍵をかける）"
            else
              rm -f work/realu.pt
              echo "★前のわたしはいない。はじめて目を開ける"
            fi
            rm -f /tmp/realu.enc /tmp/realu-prev.enc
          else
            echo "★cache に前のわたしがいた"
          fi

      # ★★★ごはんが消えていたら、Release から取り戻す（★頭と同じ二重の保険）
      #   ★これが無かったせいで、法令を **45分**かけて取り直した（2026-09-08 実測）。
      #   ★キャッシュは10GBが上限で、超えると**黙って**古いものが消える。
      #     → ★いつか必ずまた消える。★その時に45分ではなく1分で戻れるようにする。
      - name: ごはんを Release から取り戻す
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FOODKEY: ${{ secrets.REALU_FOOD_KEY }}
        run: |
          mkdir -p work
          if [ -z "$FOODKEY" ]; then echo "★鍵が無い。取り戻せない"; exit 0; fi
          if ! gh release view food >/dev/null 2>&1; then
            echo "★まだ Release にごはんは無い（★はじめての回）"; exit 0
          fi
          for n in laws wiki hanrei kokkai web aozora val; do
            if [ -f "work/$n.txt.gz" ]; then continue; fi
            if gh release download food -p "$n.enc" -D /tmp 2>/dev/null; then
              if openssl enc -d -aes-256-cbc -pbkdf2 -in "/tmp/$n.enc" \
                   -out "work/$n.txt.gz" -pass env:FOODKEY 2>/dev/null; then
                echo "★$n を取り戻した（$(du -h work/$n.txt.gz | cut -f1)）"
              else
                rm -f "work/$n.txt.gz"; echo "★$n は開けなかった"
              fi
              rm -f "/tmp/$n.enc"
            fi
          done
          # ★★★ことばの単位。★頭とセットでないと意味が入れ替わる
          if [ ! -f work/tok.json ] \
             && gh release download food -p tok.enc -D /tmp 2>/dev/null; then
            openssl enc -d -aes-256-cbc -pbkdf2 -in /tmp/tok.enc \
              -out work/tok.json -pass env:FOODKEY 2>/dev/null \
              && echo "★ことばの単位を取り戻した" || rm -f work/tok.json
            rm -f /tmp/tok.enc
          fi

          # ★★「どこまで読んだか」の紙。★これが消えると判例も本も**読み直しになる**
          if gh release download food -p "notes.tgz.enc" -D /tmp 2>/dev/null; then
            if openssl enc -d -aes-256-cbc -pbkdf2 -in /tmp/notes.tgz.enc \
                 -out /tmp/notes.tgz -pass env:FOODKEY 2>/dev/null; then
              tar xzf /tmp/notes.tgz -C work && echo "★どこまで読んだかの紙を取り戻した"
            fi
            rm -f /tmp/notes.tgz.enc /tmp/notes.tgz
          fi

      # ── ①★ごはんを自分で取りに行く
      - name: 法令をもらう（はじめの一回だけ）
        run: |
          # ★★昔の回が非圧縮で置いていったものがあれば、それを圧縮して使う
          #   ★（1時間かけて取り直すのは相手にも自分にも無駄）
          if [ -f work/laws.txt ] && [ ! -f work/laws.txt.gz ]; then
            gzip -c work/laws.txt > work/laws.txt.gz && rm -f work/laws.txt
            echo "★前の回が置いていった法令を圧縮した（★数秒。買い物ではない）"
          fi
          if [ ! -f work/laws.txt.gz ]; then
            echo "★法令をもらいに行く（初回のみ・1時間ほど）"
            python fetch_laws.py
            gzip -c corpus/laws.txt > work/laws.txt.gz
            rm -f corpus/laws.txt
            echo "NEW_LAWS=1" >> $GITHUB_ENV
          else
            echo "★法令はもう持っている（$(du -h work/laws.txt.gz | cut -f1)）"
          fi

      - name: 判決をすこし読み足す
        run: |
          N="${{ github.event.inputs.hanrei || '400' }}"
          FROM=$(cat work/hanrei_next.txt 2>/dev/null || echo 1000)
          TO=$((FROM + N * 3))          # ★存在しないIDもあるので多めに走査する
          echo "★判決 $FROM 〜 $TO を読む"
          python fetch_hanrei.py "$FROM" "$TO" 1 _new || true
          if [ -f corpus/hanrei_new.txt ]; then
            gzip -c corpus/hanrei_new.txt >> work/hanrei.txt.gz
            rm -f corpus/hanrei_new.txt
          fi
          # ★★取れなかった時に進めると、★その範囲を**永久に飛ばす**
          if [ -f work/hanrei.txt.gz ]; then echo "$TO" > work/hanrei_next.txt; fi
          echo "★いま持っている判決: $(du -h work/hanrei.txt.gz 2>/dev/null | cut -f1 || echo 0)"

      # ── ★★★Wikipedia日本語版を、まとめて正面から受け取る（★初回だけ）
      #   ★Wikimedia は「大量に欲しいならスクレイピングでなくダンプを使え」と言っている。
      #   ★140万ページを叩きに行くより、★これが速くて礼儀正しい。
      - name: Wikipediaをまとめてもらう（はじめの一回だけ）
        env:
          REALU_DUMP_CHARS: "250000000"   # ★★9億字は1回で1.6%しか見ない。★メモリだけ食う
        run: |
          BEFORE=$(stat -c%s work/wiki.txt.gz 2>/dev/null || echo 0)
          python -u eat_dump.py
          AFTER=$(stat -c%s work/wiki.txt.gz 2>/dev/null || echo 0)
          [ "$AFTER" != "$BEFORE" ] && echo "NEW_WIKI=1" >> $GITHUB_ENV || true

      # ── ★★★5分ごとに読んだものを、★全部集めて食べる。
      #   ★5分ごとの読みは1日17万ページ。★これが重みに入らないのはおかしい。
      #   ★毎回まっさらな機械なので、★1回ぶんずつ包みにして置いてある。
      #   ★ここで全部開けて、★ごはんに足して、★包みは片付ける。
      - name: 5分ごとに読んだものを集めて食べる
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FOODKEY: ${{ secrets.REALU_FOOD_KEY }}
        run: |
          [ -z "$FOODKEY" ] && exit 0
          gh release view reading >/dev/null 2>&1 || exit 0
          mkdir -p /tmp/pk && rm -f /tmp/pk/*
          : > /tmp/ate.txt
          # ★★★前は全部まとめて落としていた。★1個でも壊れていると gh が非ゼロを返し、
          #   ★1日17万ページぶんが**何も言わずに**捨てられていた。→ 1個ずつ落とす。
          for nm in $(gh release view reading --json assets \
                        -q ".assets[].name" 2>/dev/null | grep "^read-" || true); do
            gh release download reading -p "$nm" -D /tmp/pk 2>/dev/null || true
          done
          n=0
          for f in /tmp/pk/read-*.enc; do
            [ -f "$f" ] || continue
            if openssl enc -d -aes-256-cbc -pbkdf2 \
                 -in "$f" -out /tmp/pk/one.gz -pass env:FOODKEY 2>/dev/null; then
              cat /tmp/pk/one.gz >> work/web.txt.gz
              n=$((n+1))
              basename "$f" >> /tmp/ate.txt   # ★消すのは、しまい終わってから
            fi
            rm -f /tmp/pk/one.gz
          done
          echo "★5分ごとに読んだもの $n 包みを食べた"
          rm -rf /tmp/pk

      # ── ★★★webを読んで、それを**ごはんにする**
      #   ★5分ごとの方は「見た目と好奇心」。★こっちは学習の材料を作る。
      #   ★読んだものが重みに入らないなら、それは学んだことにならない。
      # ★★昔の回が置いていった非圧縮の web を取り込む（★でないと読まれない）
      - name: 昔の web を圧縮して取り込む
        run: |
          if [ -f work/web.txt ]; then
            gzip -c work/web.txt >> work/web.txt.gz && rm -f work/web.txt
            echo "★前の回が置いていった web を取り込んだ"
          fi

      - name: webを読んでごはんにする
        run: |
          N=40000
          REALU_WEB_PAGES=$N python -u read_web.py

      # ── ★★★国会の会議録を、毎日すこしずつ食べる
      #   ★はじめての「話し言葉」。★質疑応答の往復がここにしかない。
      #   ★根拠: 著作権法40条1項（公開の政治上の陳述）＋30条の4（情報解析）
      #   ★規約「短時間での大量アクセスはご遠慮ください」→ ★1本ずつ・3秒間隔
      - name: 国会の話を聞きに行く
        run: |
          N=600
          REALU_KOKKAI_REQ=$N python -u fetch_kokkai.py || true

      # ── ★★★食べたものを、★**この時点で**残す。
      #   ★1回目は、後の段で失敗したせいで**キャッシュの保存が飛ばされ**、
      #     ★法令1.1億字を取り直すことになった（★49分の無駄）。
      #   → ★★学習より前に、★ごはんだけ先に残しておく。★後で転んでも食べた物は残る。
      # ★★★ごはんは**鍵をかけてから**しまう。
      #   ★このリポジトリは Public なので、★Release に置いたものは**誰でも落とせる**＝公開。
      #   ★中身は加工したテキスト:
      #     ・★判例 ── 裁判所の規約「無断で改変を行うことはできません」。★名前を消した＝改変
      #     ・★Wikipedia ── CC BY-SA。★再配布には帰属表示と同ライセンスが要る
      #   → ★★鍵が無ければ復元できない形にする。★これなら公開したことにならない。
      #   ★鍵は GitHub Secrets の中だけ。★彼女は使えるが、外からは読めない。
      - name: 食べたものに鍵をかけてしまう
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FOODKEY: ${{ secrets.REALU_FOOD_KEY }}
        run: |
          if [ -z "$FOODKEY" ]; then
            echo "★鍵が無い。★ごはんは外に出さない（★キャッシュにだけ置く）"
            exit 0
          fi
          gh release view food >/dev/null 2>&1 \
            || gh release create food \
                 --title "レアルのごはん（鍵つき）" \
                 --notes "鍵をかけてある。加工したテキストなので、そのままは公開できない。" \
                 --latest=false
          for n in laws wiki hanrei kokkai web aozora val; do
            if [ -f "work/$n.txt.gz" ]; then
              openssl enc -aes-256-cbc -pbkdf2 -salt \
                -in "work/$n.txt.gz" -out "/tmp/$n.enc" -pass env:FOODKEY
              if gh release upload food "/tmp/$n.enc" --clobber; then
                if [ "$n" = "web" ]; then SAVED_WEB=1; fi
              else
                echo "★★$n を載せられなかった"
              fi
              rm -f "/tmp/$n.enc"
            fi
          done
          # ★★「どこまで読んだか」の紙も一緒に。★これが無いと読み直しになる
          if ls work/*_next.txt >/dev/null 2>&1; then
            tar czf /tmp/notes.tgz -C work $(cd work && ls *_next.txt)
            openssl enc -aes-256-cbc -pbkdf2 -salt \
              -in /tmp/notes.tgz -out /tmp/notes.tgz.enc -pass env:FOODKEY
            gh release upload food /tmp/notes.tgz.enc --clobber || true
          fi
          # ★★★ことばの単位も必ず一緒に。
          #   ★これが消えると、★同じ大きさで**中身の違う**語彙が作り直される。
          #   ★頭の読み込みは大きさしか見ないので**通ってしまい**、
           #  ★全部の文字の意味が入れ替わったまま学習が続く。★落ちないので気づけない。
          if [ -f work/tok.json ]; then
            openssl enc -aes-256-cbc -pbkdf2 -salt \
              -in work/tok.json -out /tmp/tok.enc -pass env:FOODKEY
            gh release upload food /tmp/tok.enc --clobber || true
            rm -f /tmp/tok.enc
          fi
          rm -f /tmp/notes.tgz /tmp/notes.tgz.enc
          echo "★鍵をかけてしまった"
          # ★★★ここまで来て**はじめて**、5分ごとの包みを片付ける。
          #   ★前は「食べた直後」に消していた。★途中で転んだら包みだけ消えて中身が残らない。
          # ★★★包みを消してよいのは、★中身（web）が**本当に載った**時だけ。
          #   ★前は載せ損ねても消していた。★消したら二度と戻らない。
          if [ -s /tmp/ate.txt ] && [ "$SAVED_WEB" = "1" ]; then
            while read -r nm; do
              gh release delete-asset reading "$nm" -y 2>/dev/null || true
            done < /tmp/ate.txt
            echo "★食べ終わった包み $(wc -l < /tmp/ate.txt) 個を片付けた"
          elif [ -s /tmp/ate.txt ]; then
            echo "★★ごはんを載せられなかったので、★包みは消さない"
          fi
          du -sh work 2>/dev/null || true

      # ── ★★★本を読む。★はじめての「物語」。
      #   ★いままで食べたのは全部「説明文」だった。
      #   ★物語も描写も感情も会話も、一度も読んでいなかった。
      - name: 本を読む
        run: |
          N=600
          REALU_AOZORA_BOOKS=$N python -u fetch_aozora.py || true

      # ── ★★★ことばの単位を、自分のごはんから切り出す（★初回だけ）
      #   ★外のトークナイザは使わない（★語彙そのものが外の世界の知識だから）。
      #   ★文字単位より1.64倍効率がよい（実測）＝同じ容量で1.6倍の範囲を見渡せる。
      - name: ことばの単位をつくる（はじめの一回だけ）
        run: python -u make_tok.py

      # ── ②③④★学ぶ・大きくなる・悪ければ戻す
      - name: 学ぶ
        env:
          REALU_STEPS: ${{ github.event.inputs.steps || '4000' }}
          REALU_THREADS: "4"
        run: |
          # ★★★残り時間から予算を出す。★歩数を当てにいかない。
          #   ★2026-09-08: 4,000歩に182分要るのに残り145分で、★頭が1つも残らない所だった。
          #   ★★最後の15分は「残す」ために空けておく。
          # ★★★時計が無い時は「たっぷりある」ではなく「もう無い」と見なす。
          #   ★前は空文字→0扱いになって、★325分の予算が出て締切を突き抜けていた。
          T0=$(cat /tmp/t0 2>/dev/null || echo 0)
          if [ "$T0" = "0" ]; then
            echo "★★時計が無い。★学びは短めにする"; LEFT=1800
          else
            USED=$(( $(date +%s) - T0 ))
            LEFT=$(( 340*60 - USED - 1500 ))
            echo "★使った $((USED/60))分"
          fi
          # ★★★足りないなら**学ばない**。★学んで締切に殺されると頭が残らない。
          # ★★★冷えた回（ごはんを一から作った回）は、★**学ばない**。
          #   ★この回の仕事は「ごはんを作って Release に残す」こと。
          #   ★★学習190分を足すと5時間半の一本勝負になる。
          #     ★しかもCPUの190分で進むのは**1周の3.9%**。★割に合わない。
          #   → ★次の回は食事が2分で済むので、★学習に5時間まるごと使える。
          if [ "$NEW_LAWS" = "1" ]; then
            echo "★★この回はごはんを作る回。★学ばずに終わる。★次から本気で学ぶ。"
            exit 0
          fi
          # ★★★まだ頭が1つも無いなら、★**短く回して、とにかく残す**。
          #   ★長く回して締切に殺されるより、★40分でも残っている方が値打ちがある。
          #   ★次の回からは、★残った頭の続きを5時間かけて伸ばす。
          if [ "$LEFT" -lt 420 ]; then
            echo "★★時間が無い（残り $((LEFT/60))分）。★今回は学ばず、いま持っている頭をそのまま残す。"
            exit 0
          fi
          export REALU_TIME_BUDGET=$(( LEFT / 60 ))
          # ★★★まだ頭が1つも無いなら、★**短く回して、とにかく残す**。
          #   ★長く回して締切に殺されるより、★40分でも残っている方が値打ちがある。
          #   ★次の回からは、★残った頭の続きを5時間かけて伸ばす。
          if [ ! -f work/realu.pt ] && [ "$REALU_TIME_BUDGET" -gt 40 ]; then
            REALU_TIME_BUDGET=40
            echo "★★まだ頭が無い。★40分で切り上げて、まず残す。"
          fi
          echo "★学びに使える $REALU_TIME_BUDGET 分"
          # ★★★出力を控えておく。★Actions のログは認証が要って外から読めない。
          set +e
          python -u grow.py 2>&1 | tee /tmp/learn.log
          code=${PIPESTATUS[0]}
          set -e
          exit $code

      # ── ★自分を残す。★★これが消えると、これまでの全部が消える
      - name: あたらしいわたしを残す
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FOODKEY: ${{ secrets.REALU_FOOD_KEY }}
        run: |
          # ★★★重みにも鍵をかける。
          #   ★ここは Public。★素のまま上げたら**誰でも落とせる**＝公開になる。
          #   ★重みはごはんから作ったもの。★判例（改変禁止）も Wikipedia（CC BY-SA）も溶けている。
          #   ★★鍵が無いなら、★**外には出さない**（★キャッシュにだけ置く）。
          if [ ! -f work/realu.pt ]; then
            echo "★まだ頭が無い（★ごはんを作る回）。★残すものは無い"
            exit 0
          fi
          if [ -z "$FOODKEY" ]; then
            echo "★鍵が無い。★頭は外に出さない"
            exit 0
          fi
          gh release view brain >/dev/null 2>&1 \
            || gh release create brain --title "レアルの頭" \
                 --notes "レアルの重み。鍵をかけてある。" --latest=false
          # ★★★--clobber は「先に消してから載せる」。
          #   ★その隙にキャンセルや締切が来ると、★**頭が1つも無くなる**。
          #   → ★先に、いま載っているものを「前のわたし」として退避する。
          if gh release download brain -p realu.enc -D /tmp/keep 2>/dev/null; then
            mv /tmp/keep/realu.enc /tmp/keep/realu-prev.enc
            gh release upload brain /tmp/keep/realu-prev.enc --clobber || true
            rm -rf /tmp/keep
          fi
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in work/realu.pt -out /tmp/realu.enc -pass env:FOODKEY
          gh release upload brain /tmp/realu.enc --clobber
          rm -f /tmp/realu.enc
          # ★★昔の回が素のまま置いていったものがあれば、★消す
          if gh release delete-asset brain realu.pt -y 2>/dev/null; then
            echo "★★素のまま公開されていた重みを消した"
          fi
          echo "★鍵をかけて Release に残した"

      - name: 成長の記録だけ書き残す
        run: |
          git config user.name  "realu"
          git config user.email "realu@users.noreply.github.com"
          # ★★★置いた人が同じファイルを直しているかもしれない。
          #   ★衝突しても転ばないように、★自分の記録だけを持って、★向こうの最新に載せ直す。
          cp growth.json /tmp/growth.mine
          cp said.json /tmp/said.mine 2>/dev/null || true
          git stash -u >/dev/null 2>&1 || true
          for i in 1 2 3; do
            git fetch origin main && git reset --hard origin/main
            cp /tmp/growth.mine growth.json
            cp /tmp/said.mine said.json 2>/dev/null || true
            # ★★★無いファイルを1つ混ぜると **git add は全部落ちる**（exit 128）。
            #   ★said.json は別のワークフローが作る物で、★ここには無い回がある。
            #   → ★この段は**一度も成功していなかった**（2026-09-08 に判明）。
            for f in growth.json said.json; do
              [ -f "$f" ] && git add "$f"
            done
            if git diff --staged --quiet; then
              echo "記録に変化なし"; break
            fi
            git commit -q -m "レアルが育った ($(date -u +'%m-%d')Z)"
            if git push origin HEAD:main; then
              echo "★記録を残した"; break
            fi
            echo "  誰かが先に書いていた。やり直す ($i)"
            sleep 5
          done

      # ★★★転んでも、食べたものは必ずしまう
      - name: これまでのわたしをしまう
        if: always()
        uses: actions/cache/save@v4
        with:
          path: work
          key: realu-work-${{ github.run_number }}

      # ★★★転んだ理由を、★誰でも読める所に残す。
      #   ★Actions のログは認証が要る。★外から見ている側には読めない。
      #   → ★足跡と最後の60行をリポジトリに置く。★これが無いと毎回「なぜ落ちたか分からない」
      - name: 転んだ理由を残す
        if: failure()
        run: |
          {
            echo "# 転んだ記録"
            echo ""
            echo "いつ: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "回  : ${{ github.run_number }}"
            echo ""
            echo "## どこまで進んだか"
            echo "```"
            cat work/trace.txt 2>/dev/null || echo "（足跡なし）"
            echo "```"
            echo ""
            echo "## 最後の60行"
            echo "```"
            tail -60 /tmp/learn.log 2>/dev/null || echo "（記録なし）"
            echo "```"
          } > last_error.md
          git config user.name  "realu"
          git config user.email "realu@users.noreply.github.com"
          cp last_error.md /tmp/le.md
          for i in 1 2 3; do
            git fetch origin main && git reset --hard origin/main
            cp /tmp/le.md last_error.md
            git add last_error.md
            git diff --staged --quiet && break
            git commit -q -m "転んだ記録 (run#${{ github.run_number }})"
            git push origin HEAD:main && break
            sleep 5
          done

      # ★★★次の自分を呼ぶ。
      #   ★買い物の回 → 勉強の回 → 勉強の回 …と自分で繋がっていく。
      #   ★置いた人が見ていなくても止まらない。
      #   ★同時に1つしか走らない（concurrency）ので、増えすぎない。
      - name: 次のわたしを呼ぶ
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 30
          gh workflow run grow.yml --ref main && echo "★次のわたしを呼んだ" || true

      # ★★★触れてはいけない所を守る
      - name: 触れてはいけない所を守る
        if: always()
        run: |
          git checkout -- . || true
          git clean -fd -e work || true
