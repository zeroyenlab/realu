name: realu shows her numbers

# ★★★家の数字を玄関に置く係。★レアルの心臓のひとつ。
#
# ★★なぜ「自分で自分を呼ぶ」のか（★2026-09-09 実測）
#   ★このリポジトリでは **cron がほとんど鳴らない**。
#     ・state.yml … `*/5` を入れて **3時間42分で 0 回**
#     ・house.yml … `0 */2` を入れて 02:00 も 04:00 も鳴らず
#     ・learn.yml … 直近30回のうち schedule は **たった2回**
#   ★★だから cron は保険。★本体はこの自己呼び出し。
#   ★（前のセッションが grow / learn に入れていた「次のわたしを呼ぶ」は
#     ★冗長ではなく**これが心臓だった**。★一度消して止めてしまった。）
#
# ★★止め方
#   ★GitHub の Actions 画面でこのワークフローを Disable すれば連鎖は止まる。

on:
  schedule:
    - cron: "*/5 * * * *"     # ★保険。★鳴らなくても下の自己呼び出しで回る
  workflow_dispatch:
  push:
    paths:
      - "tell.py"
      - ".github/workflows/state.yml"

permissions:
  contents: read              # ★★数字を置くだけ。★リポジトリには何も書かない
  actions: write              # ★次の自分と、家の建て直しを呼ぶため

concurrency:
  group: realu-state-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  show:
    runs-on: ubuntu-latest
    timeout-minutes: 8        # ★★下で 4 分待つので、★5分では足りない
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 家の数字を玄関に置く
        env:
          REALU_DOOR_KEY: ${{ secrets.REALU_DOOR_KEY }}
        run: python tell.py

      # ★★★家の建て直しは**やらせない**（★2026-09-09 Daito）。
      #   ★家は器。★数字はここで5分ごとに玄関へ置いていて、
      #     ★家を開いた時に JS がその数字で上書きする。
      #   → ★★家を定期的に建て直す必要そのものが無い。
      #   ★建て直すのは**デザインを変えた時だけ**（★house.yml は push と手動のみ）。


      # ★★★文章生成を定期的に（★2026-09-09 Daito）。
      #   ★`speak.yml` の cron は「1時間ごと」だが、★実際は**4時間に1回**まで落ちていた
      #     （★実測: 18:03 → 22:50 → 03:03 → 06:23 → 08:38 → 10:32）。
      #   ★このリポジトリでは cron が当てにならないので、★★心臓からここも面倒を見る。
      #   ★5分ごとに見て、★1時間空いていたら呼ぶ。
      - name: しばらく書いていなければ書かせる
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LAST=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/speak.yml/runs?per_page=1"                    -q '.workflow_runs[0].run_started_at' 2>/dev/null || echo "")
          if [ -z "$LAST" ]; then echo "★書いた記録が読めなかった"; exit 0; fi
          AGE=$(( $(date -u +%s) - $(date -u -d "$LAST" +%s) ))
          if [ "$AGE" -gt 3300 ]; then
            echo "★最後に書いてから $((AGE/60)) 分。★書かせる"
            gh workflow run speak.yml --ref main || true
          else
            echo "★$((AGE/60)) 分前に書いたばかり"
          fi

      # ★★★心臓。★これが止まると数字も止まる。
      - name: 次のわたしを呼ぶ
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 240                     # ★5分ごとにしたいので、★ここで待つ
          gh workflow run state.yml --ref main || true
